name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare HTML with ion token
        env:
          accesstoken: ${{ secrets.accesstoken }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          token = os.environ.get("accesstoken", "").strip()

          if not token:
              raise SystemExit("Repository secret 'accesstoken' is missing.")

          # Reject characters that could break a JavaScript string.
          if not re.fullmatch(r"[A-Za-z0-9._~-]+", token):
              raise SystemExit("Unexpected token format. Check the secret value.")

          source = Path("index.html")
          if not source.is_file():
              raise SystemExit("index.html was not found at the repository root.")

          html = source.read_text(encoding="utf-8")
          placeholder = "__accesstoken__"

          if placeholder not in html:
              raise SystemExit("Token placeholder was not found in index.html.")

          output = Path("_site")
          output.mkdir(exist_ok=True)
          (output / "index.html").write_text(
              html.replace(placeholder, token),
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
