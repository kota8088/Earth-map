name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Replace Cesium token placeholder
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("ACCESSTOKEN", "").strip()
          if not token:
              raise SystemExit(
                  "Repository Secret ACCESSTOKEN が空か、Actionsから参照できません"
              )

          path = Path("index.html")
          if not path.is_file():
              raise SystemExit("リポジトリ直下に index.html がありません")

          html = path.read_text(encoding="utf-8")
          marker = '"__accesstoken__"'

          if marker not in html:
              raise SystemExit(
                  'index.html に "__accesstoken__" が見つかりません。'
                  "プレースホルダーの表記を確認してください。"
              )

          html = html.replace(marker, json.dumps(token))
          path.write_text(html, encoding="utf-8")

          if marker in path.read_text(encoding="utf-8"):
              raise SystemExit("トークン置換後もプレースホルダーが残っています")

          print("Cesium token placeholder replaced successfully.")
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
