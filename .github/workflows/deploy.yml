name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Replace token placeholder
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("ACCESSTOKEN", "")
          if not token:
              raise SystemExit("Repository Secret ACCESSTOKEN が設定されていません")

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = '"__accesstoken__"'

          if marker not in html:
              raise SystemExit('index.html に "__accesstoken__" がありません')

          html = html.replace(marker, json.dumps(token))
          path.write_text(html, encoding="utf-8")
          PY

      - name: Prepare Pages files
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
