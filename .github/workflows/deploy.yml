name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Replace Cesium token placeholder
        env:
          ACCESSTOKEN: ${{ secrets.accesstoken }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ.get("ACCESSTOKEN", "").strip()
          if not token:
              raise SystemExit(
                  "Secret accesstoken が空、またはこのワークフローから参照できません。"
                  "Settings → Secrets and variables → Actions を確認してください。"
              )

          path = Path("index.html")
          if not path.is_file():
              raise SystemExit("リポジトリ直下に index.html がありません。")

          html = path.read_text(encoding="utf-8")
          encoded_token = json.dumps(token)

          # HTML内のプレースホルダーがシングル・ダブルクォートのどちらでも置換
          markers = [
              '"__accesstoken__"',
              "'__accesstoken__'",
          ]

          replaced = False
          for marker in markers:
              if marker in html:
                  html = html.replace(marker, encoded_token)
                  replaced = True

          if not replaced:
              raise SystemExit(
                  'index.html に "__accesstoken__" が見つかりません。'
                  "プレースホルダーの表記を確認してください。"
              )

          if "__accesstoken__" in html:
              raise SystemExit("置換後もプレースホルダーが残っています。")

          path.write_text(html, encoding="utf-8")
          print("トークンの置換に成功しました。")
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
