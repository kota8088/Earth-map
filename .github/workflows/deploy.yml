name: Deploy Cesium Explorer to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and inject Cesium ion token
        env:
          ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          token = os.environ.get("ACCESSTOKEN", "")
          if not token:
              raise SystemExit("GitHub Repository Secret ACCESSTOKEN が設定されていません。")

          source = Path("index.html")
          if not source.exists():
              raise SystemExit("index.html が見つかりません。")

          html = source.read_text(encoding="utf-8")
          placeholder = "__accesstoken__"
          if placeholder not in html:
              raise SystemExit("index.html に __accesstoken__ がありません。")

          # 公開用ディレクトリにはindex.htmlのみを配置し、.env等はコピーしない
          output = Path("dist")
          output.mkdir(exist_ok=True)
          (output / "index.html").write_text(
              html.replace(placeholder, token),
              encoding="utf-8"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
