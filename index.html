<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .94);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .top-actions { margin-left: auto; }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: rgba(118, 186, 255, .75); }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .78);
    }

    .landmarks button { flex: 0 0 auto; }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 120px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .topbar {
        gap: 7px;
        padding: 6px 8px;
      }

      .brand { font-size: 12px; }
      .top-actions { margin-left: 0; }
      .topbar button { padding: 6px 8px; font-size: 12px; }
      .landmarks { top: 100px; }
      .panel { top: 145px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">EARTH <span>EXPLORER</span></div>

    <nav class="button-row" aria-label="地球データ">
      <button type="button" data-layer="osm" class="selected">OSM建物</button>
      <button type="button" data-layer="google">Google 3D</button>
    </nav>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">全体表示</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>
  <div id="cesiumContainer" aria-label="地球の3D表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>地球のデータ情報</strong>
      <button type="button" id="closeInfo" aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    const CONFIG = {
      // Cesium ionのトークンに置き換えてください。
      ionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IndSQ0UxQzJmZkhKUnE4Qm8iLCJqdGkiOiI3Yjg5YzUwZC02NTlmLTQzODctYjExYi04MTY4Nzk2NzA0YjEiLCJpZCI6NTEyNjIzLCJzdWIiOiJrb3RhODA4OCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiLlroflrpnjg57jg4Pjg5fnlKgiLCJpYXQiOjE3OTUxNDY2NDV9.ISQO_VX5rw02TFzQm_HEkUgV5HgJdeQ48ogXJVMsqL8",

      // このページで使う地球のアセット
      earthAssets: {
        osmBuildings: 96188,
        googlePhotorealistic: 2275207
      },

      // 月・火星は別サイト用。このページでは読み込みません。
      otherAssets: {
        moon: 2684829,
        mars: 3644333
      }
    };

    const LANDMARKS = [
      { name: "東京タワー", lon: 139.7454, lat: 35.6586, height: 3500 },
      { name: "エッフェル塔", lon: 2.2945, lat: 48.8584, height: 3500 },
      { name: "自由の女神", lon: -74.0445, lat: 40.6892, height: 4500 }
    ];

    const $ = (id) => document.getElementById(id);

    let viewer = null;
    let currentTileset = null;
    let activeLayer = "osm";
    let loadGeneration = 0;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function tokenIsConfigured() {
      return CONFIG.ionToken &&
        !CONFIG.ionToken.includes("PASTE_YOUR");
    }

    function goHome() {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(0, 15, 20000000),
        duration: 1.2
      });
    }

    function goToLandmark(place) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          place.lon,
          place.lat,
          place.height
        ),
        orientation: {
          heading: Cesium.Math.toRadians(15),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2
      });
    }

    function addLandmarkButtons() {
      const container = $("landmarks");

      for (const place of LANDMARKS) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = place.name;
        button.addEventListener("click", () => goToLandmark(place));
        container.appendChild(button);
      }
    }

    function removeCurrentTileset() {
      if (!currentTileset) return;

      if (!currentTileset.isDestroyed()) {
        viewer.scene.primitives.remove(currentTileset);
      }

      currentTileset = null;
    }

    async function loadTileset(layer) {
      activeLayer = layer;
      const requestId = ++loadGeneration;

      removeCurrentTileset();
      updateLayerButtons();

      if (!tokenIsConfigured()) {
        setStatus(
          "衛星画像は表示中です。3DデータにはCesium ionトークンが必要です。"
        );
        return;
      }

      const assetId = layer === "osm"
        ? CONFIG.earthAssets.osmBuildings
        : CONFIG.earthAssets.googlePhotorealistic;

      const layerName = layer === "osm"
        ? "Cesium OSM Buildings"
        : "Google Photorealistic 3D Tiles";

      setStatus(`${layerName}を読み込み中…`);

      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(assetId);

        // 読み込み中に別のデータへ切り替わっていたら、古い結果を破棄。
        if (requestId !== loadGeneration) {
          tileset.destroy();
          return;
        }

        currentTileset = tileset;
        tileset.maximumScreenSpaceError = 2;
        viewer.scene.primitives.add(tileset);

        setStatus(
          `${layerName}を読み込みました。建物を見るには都市部までズームしてください。`
        );

        renderInfo();
      } catch (error) {
        if (requestId !== loadGeneration) return;

        console.error(`${layerName}の読み込みエラー:`, error);

        setStatus(
          `${layerName}を読み込めません。ionトークンとアセットへのアクセス権を確認してください。`
        );

        renderInfo(`読み込み失敗（Asset ID: ${assetId}）`);
      }
    }

    function updateLayerButtons() {
      document.querySelectorAll("[data-layer]").forEach((button) => {
        button.classList.toggle(
          "selected",
          button.dataset.layer === activeLayer
        );
      });
    }

    function renderInfo(loadState = "表示中") {
      const layerName = activeLayer === "osm"
        ? "Cesium OSM Buildings"
        : "Google Photorealistic 3D Tiles";

      const assetId = activeLayer === "osm"
        ? CONFIG.earthAssets.osmBuildings
        : CONFIG.earthAssets.googlePhotorealistic;

      $("infoContent").textContent =
        `選択中: ${layerName} / Asset ID: ${assetId}。` +
        `衛星画像: Esri World Imagery。読み込み状態: ${loadState}。` +
        `月（${CONFIG.otherAssets.moon}）・火星（${CONFIG.otherAssets.mars}）はこのページでは使用しません。`;
    }

    function addSatelliteImagery() {
      const imageryProvider = new Cesium.UrlTemplateImageryProvider({
        url:
          "https://server.arcgisonline.com/ArcGIS/rest/services/" +
          "World_Imagery/MapServer/tile/{z}/{y}/{x}",
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        maximumLevel: 19,
        credit: "Tiles © Esri"
      });

      imageryProvider.errorEvent.addEventListener((error) => {
        console.error("衛星画像の読み込みエラー:", error);
        setStatus("衛星画像を読み込めません。ネット接続を確認してください。");
      });

      viewer.imageryLayers.removeAll();
      viewer.imageryLayers.addImageryProvider(imageryProvider);
    }

    function setupControls() {
      document.querySelectorAll("[data-layer]").forEach((button) => {
        button.addEventListener("click", () => {
          loadTileset(button.dataset.layer);
        });
      });

      $("homeButton").addEventListener("click", goHome);

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
        renderInfo();
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });
    }

    function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。ネット接続を確認してください。");
        return;
      }

      if (tokenIsConfigured()) {
        Cesium.Ion.defaultAccessToken = CONFIG.ionToken;
      }

      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false
      });

      viewer.scene.globe.show = true;
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      addSatelliteImagery();
      addLandmarkButtons();
      setupControls();
      renderInfo();
      goHome();

      // 初期表示ではOSM建物を読み込みます。
      loadTileset("osm");
    }

    start();
  </script>
</body>
</html>
