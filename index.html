<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地球・月・火星エクスプローラー</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #panel {
      position: absolute;
      z-index: 5;
      top: 16px;
      left: 16px;
      width: min(330px, calc(100vw - 56px));
      padding: 16px;
      color: #f3f6ff;
      background: rgba(10, 16, 30, .86);
      border: 1px solid rgba(180, 205, 255, .2);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .4);
      backdrop-filter: blur(12px);
    }

    h1 { margin: 0 0 4px; font-size: 17px; }
    .subtitle { margin: 0 0 14px; color: #aab7d0; font-size: 12px; }
    .section-title {
      margin: 14px 0 7px;
      color: #aab7d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    #spotButtons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    button {
      min-height: 34px;
      padding: 7px 9px;
      color: #eaf0ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(190, 210, 255, .2);
      border-radius: 7px;
    }

    button:hover { background: rgba(130, 170, 255, .2); }
    button.active { background: #2768d8; border-color: #70a5ff; }
    #spotButtons button { text-align: left; }

    .slider-line {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 5px;
      color: #d8e1f5;
      font-size: 12px;
    }

    input[type="range"] { width: 100%; accent-color: #68a1ff; }
    #status { min-height: 16px; margin-top: 10px; color: #aab7d0; font-size: 11px; line-height: 1.45; }
    #status.error { color: #ff9b9b; }

    @media (max-width: 480px) {
      #panel { top: 8px; left: 8px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <aside id="panel">
    <h1>惑星エクスプローラー</h1>
    <p class="subtitle">地球・月・火星を切り替えて探索</p>

    <div class="section-title">天体</div>
    <div class="button-row">
      <button type="button" data-body="earth" class="active">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </div>

    <div class="section-title">名所</div>
    <div id="spotButtons"></div>

    <div class="section-title">太陽光・時間</div>
    <div class="slider-line">
      <label for="timeSlider">時刻（UTC）</label>
      <span id="timeLabel">12:00</span>
    </div>
    <input id="timeSlider" type="range" min="0" max="1439" value="720" step="1">
    <div id="status" role="status">初期化しています…</div>
  </aside>

  <script>
    (async function () {
      "use strict";

      // YAML内のキーは accesstoken: "..." または accesstoken: ... にしてください。
      // HTMLからサーバー環境変数を直接読むことはできないため、
      // config.yaml は環境変数 accesstoken を使って配信前に生成してください。
      const CONFIG_FILES = [
        "./config.yaml",
        "./config.yml",
        "./settings.yaml",
        "./settings.yml",
        "./.env"
      ];

      // Cesium ion 標準アセット
      const EARTH_IMAGERY_ASSET_ID = 2;
      const MOON_ASSET_ID = 2684829;
      const MARS_ASSET_ID = 3644333;

      const statusEl = document.getElementById("status");
      const spotButtonsEl = document.getElementById("spotButtons");
      const timeSlider = document.getElementById("timeSlider");
      const timeLabel = document.getElementById("timeLabel");

      let viewer;
      let activeBody = "earth";
      let switchSequence = 0;
      let activeTileset = null;
      let osmBuildings = null;

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      function extractToken(text) {
        // YAML形式: accesstoken: "token" / accesstoken: token
        // .env形式: accesstoken="token" / accesstoken=token
        const match = text.match(
          /^\s*accesstoken\s*(?::|=)\s*(?:"([^"]*)"|'([^']*)'|([^#\r\n]*?))\s*(?:#.*)?$/mi
        );
        return match ? (match[1] || match[2] || match[3] || "").trim() : "";
      }

      async function loadToken() {
        for (const url of CONFIG_FILES) {
          try {
            const response = await fetch(url, { cache: "no-store" });
            if (!response.ok) continue;

            const token = extractToken(await response.text());
            if (token && token !== "__accesstoken__") {
              Cesium.Ion.defaultAccessToken = token;
              return;
            }
          } catch (error) {
            // 存在しない設定ファイルは次の候補を試します。
          }
        }

        throw new Error(
          "アクセストークンを読み込めません。HTMLと同じ場所に config.yaml を置き、accesstoken を設定してください。"
        );
      }

      const spots = {
        earth: [
          { label: "宇宙全体", lon: 0, lat: 0, height: 22000000 },
          { label: "富士山", lon: 138.7274, lat: 35.3606, height: 18000 },
          { label: "東京スカイツリー", lon: 139.8107, lat: 35.7101, height: 3500 },
          { label: "グランドキャニオン", lon: -112.1129, lat: 36.1069, height: 22000 }
        ],
        moon: [
          { label: "ティコ", lon: -11.2, lat: -43.3, height: 90000 },
          { label: "静かの海", lon: 31.4, lat: 8.5, height: 100000 },
          { label: "コペルニクス", lon: -20.1, lat: 9.7, height: 80000 }
        ],
        mars: [
          { label: "オリンポス山", lon: -133.8, lat: 18.65, height: 150000 },
          { label: "マリネリス峡谷", lon: -59.2, lat: -13.9, height: 180000 },
          { label: "ゲール・クレーター", lon: 137.8, lat: -5.4, height: 45000 }
        ]
      };

      function updateSpotButtons() {
        spotButtonsEl.replaceChildren();

        for (const spot of spots[activeBody]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = spot.label;
          button.addEventListener("click", function () {
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(
                spot.lon,
                spot.lat,
                spot.height
              ),
              duration: 2.2
            });
          });
          spotButtonsEl.appendChild(button);
        }
      }

      function clearBodyAssets() {
        if (activeTileset) {
          viewer.scene.primitives.remove(activeTileset);
          activeTileset = null;
        }
        if (osmBuildings) {
          viewer.scene.primitives.remove(osmBuildings);
          osmBuildings = null;
        }

        viewer.imageryLayers.removeAll(true);
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
      }

      function setAtmosphere(body) {
        const scene = viewer.scene;

        if (body === "earth") {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
          scene.skyAtmosphere.show = true;
          scene.skyAtmosphere.hueShift = 0;
          scene.skyAtmosphere.saturationShift = 0;
          scene.skyAtmosphere.brightnessShift = 0;
          scene.globe.showGroundAtmosphere = true;
          scene.fog.enabled = true;
          scene.fog.color = Cesium.Color.fromCssColorString("#b7d8ff");
          scene.fog.density = 0.0002;
        } else if (body === "moon") {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
          scene.skyAtmosphere.show = false;
          scene.globe.showGroundAtmosphere = false;
          scene.fog.enabled = false;
        } else {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#080403");
          scene.skyAtmosphere.show = true;
          scene.skyAtmosphere.hueShift = 0.92;
          scene.skyAtmosphere.saturationShift = 0.35;
          scene.skyAtmosphere.brightnessShift = -0.18;
          scene.globe.showGroundAtmosphere = true;
          scene.fog.enabled = true;
          scene.fog.color = Cesium.Color.fromCssColorString("#b95d43");
          scene.fog.density = 0.00035;
        }
      }

      async function loadIonAsset(assetId, sequence) {
        const errors = [];

        // アセットの種類に応じて、地形・画像・3D Tilesの順に試します。
        try {
          const terrain = await Cesium.CesiumTerrainProvider.fromIonAssetId(
            assetId,
            { requestVertexNormals: true }
          );
          if (sequence !== switchSequence) return "stale";
          viewer.terrainProvider = terrain;
          return "terrain";
        } catch (error) {
          errors.push(error);
        }

        try {
          const imagery = await Cesium.IonImageryProvider.fromAssetId(assetId);
          if (sequence !== switchSequence) return "stale";
          viewer.imageryLayers.addImageryProvider(imagery);
          return "imagery";
        } catch (error) {
          errors.push(error);
        }

        try {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(assetId);
          if (sequence !== switchSequence) {
            viewer.scene.primitives.remove(tileset);
            return "stale";
          }
          activeTileset = tileset;
          viewer.scene.primitives.add(tileset);
          return "3dtiles";
        } catch (error) {
          errors.push(error);
        }

        console.error("ion asset load errors:", errors);
        throw new Error(
          "ionアセット " + assetId +
          " を地形・画像・3D Tilesとして読み込めません。アセットIDとトークンを確認してください。"
        );
      }

      async function switchBody(body) {
        const sequence = ++switchSequence;
        activeBody = body;

        document.querySelectorAll("[data-body]").forEach(function (button) {
          button.classList.toggle("active", button.dataset.body === body);
        });

        updateSpotButtons();
        clearBodyAssets();
        setAtmosphere(body);

        try {
          if (body === "earth") {
            setStatus("地球の衛星画像と3D地形を読み込んでいます…");

            // 地球の画像はCesium ion標準アセット、地形はCesium World Terrainを使用。
            const imageryPromise = Cesium.IonImageryProvider.fromAssetId(
              EARTH_IMAGERY_ASSET_ID
            );
            const terrainPromise = Cesium.createWorldTerrainAsync({
              requestWaterMask: true,
              requestVertexNormals: true
            });

            const imagery = await imageryPromise;
            if (sequence !== switchSequence) return;
            viewer.imageryLayers.addImageryProvider(imagery);

            const terrain = await terrainPromise;
            if (sequence !== switchSequence) return;
            viewer.terrainProvider = terrain;

            try {
              osmBuildings = await Cesium.createOsmBuildingsAsync();
              if (sequence !== switchSequence) {
                viewer.scene.primitives.remove(osmBuildings);
                osmBuildings = null;
                return;
              }
              viewer.scene.primitives.add(osmBuildings);
            } catch (error) {
              console.warn("OSM Buildingsを読み込めませんでした:", error);
            }

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 15, 22000000),
              duration: 1.8
            });
            setStatus("地球：Cesium World Imagery・World Terrain・OSM Buildings");
            return;
          }

          const assetId = body === "moon" ? MOON_ASSET_ID : MARS_ASSET_ID;
          setStatus(
            (body === "moon" ? "月" : "火星") +
            "のionアセット " + assetId + " を読み込んでいます…"
          );

          const result = await loadIonAsset(assetId, sequence);
          if (result === "stale" || sequence !== switchSequence) return;

          const initialHeight = body === "moon" ? 12000000 : 14000000;
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(0, 0, initialHeight),
            duration: 1.8
          });

          setStatus(
            (body === "moon" ? "月" : "火星") +
            "：アセット " + assetId + " を " + result + " として表示中"
          );
        } catch (error) {
          if (sequence !== switchSequence) return;
          console.error(error);
          setStatus(error.message || "アセットを読み込めませんでした。", true);
        }
      }

      function updateSunTime() {
        const value = Number(timeSlider.value);
        const hours = Math.floor(value / 60);
        const minutes = value % 60;

        timeLabel.textContent =
          String(hours).padStart(2, "0") + ":" +
          String(minutes).padStart(2, "0");

        const date = new Date();
        date.setUTCHours(hours, minutes, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(date);
        viewer.scene.requestRender();
      }

      document.querySelectorAll("[data-body]").forEach(function (button) {
        button.addEventListener("click", function () {
          switchBody(button.dataset.body);
        });
      });

      timeSlider.addEventListener("input", updateSunTime);

      try {
        await loadToken();

        viewer = new Cesium.Viewer("cesiumContainer", {
          animation: false,
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: false,
          infoBox: false,
          navigationHelpButton: false,
          sceneModePicker: false,
          selectionIndicator: false,
          timeline: false,
          vrButton: false,
          shouldAnimate: false,
          requestRenderMode: false,
          baseLayer: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider()
        });

        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.showGroundAtmosphere = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.light = new Cesium.SunLight();

        updateSunTime();
        updateSpotButtons();
        await switchBody("earth");
      } catch (error) {
        console.error(error);
        setStatus(error.message || "初期化に失敗しました。", true);
      }
    })();
  </script>
</body>
</html>
