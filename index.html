<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px 16px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .94);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand span {
      color: var(--accent);
    }

    .top-actions {
      display: flex;
      gap: 7px;
      margin-left: auto;
    }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover {
      border-color: rgba(118, 186, 255, .75);
    }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .78);
    }

    .landmarks button {
      flex: 0 0 auto;
    }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 115px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] {
      display: none;
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .topbar {
        padding: 6px 8px;
      }

      .brand {
        font-size: 12px;
      }

      .top-actions button {
        padding: 6px 8px;
        font-size: 12px;
      }

      .landmarks {
        top: 50px;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">EARTH <span>EXPLORER</span></div>

    <div class="top-actions">
      <button type="button" id="homeButton">全体表示</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>
  <div id="cesiumContainer" aria-label="地球の3D表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>地球のデータ情報</strong>
      <button type="button" id="closeInfo" aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    // 地球上の名所。heightはカメラの高度（メートル）です。
    const LANDMARKS = [
      {
        name: "東京タワー",
        lon: 139.7454,
        lat: 35.6586,
        height: 3500
      },
      {
        name: "エッフェル塔",
        lon: 2.2945,
        lat: 48.8584,
        height: 3500
      },
      {
        name: "自由の女神",
        lon: -74.0445,
        lat: 40.6892,
        height: 4500
      }
    ];

    const $ = (id) => document.getElementById(id);
    let viewer;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function goHome() {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(0, 15, 20000000),
        duration: 1.2
      });
    }

    function goToLandmark(place) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          place.lon,
          place.lat,
          place.height
        ),
        orientation: {
          heading: Cesium.Math.toRadians(15),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2
      });
    }

    function addLandmarkButtons() {
      const container = $("landmarks");

      for (const place of LANDMARKS) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = place.name;
        button.addEventListener("click", () => goToLandmark(place));
        container.appendChild(button);
      }
    }

    function addSatelliteImagery() {
      // Esriの衛星画像タイル。Cesium ionは使用しません。
      const imageryProvider = new Cesium.UrlTemplateImageryProvider({
        url:
          "https://server.arcgisonline.com/ArcGIS/rest/services/" +
          "World_Imagery/MapServer/tile/{z}/{y}/{x}",
        tilingScheme: new Cesium.WebMercatorTilingScheme(),
        maximumLevel: 19,
        credit: "Tiles © Esri"
      });

      // タイル取得に失敗した場合は、コンソールと画面に知らせます。
      imageryProvider.errorEvent.addEventListener((error) => {
        console.error("衛星画像タイルの読み込みエラー:", error);
        setStatus(
          "衛星画像を読み込めません。ネット接続やブラウザーの通信エラーを確認してください。"
        );
      });

      viewer.imageryLayers.removeAll();
      viewer.imageryLayers.addImageryProvider(imageryProvider);

      setStatus("地球の衛星画像を読み込み中…");
    }

    function setupControls() {
      $("homeButton").addEventListener("click", goHome);

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });

      $("infoContent").textContent =
        "画像: Esri World Imagery。地形: Cesium楕円体。" +
        "Cesium ionおよびionトークンは使用していません。";
    }

    function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。ネット接続を確認してください。");
        return;
      }

      viewer = new Cesium.Viewer("cesiumContainer", {
        // Cesium標準の背景画像・地形を使わず、下で衛星画像を追加します。
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),

        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false
      });

      // 球体に衛星画像を貼り付けます。
      viewer.scene.globe.show = true;
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");

      // 地表近くまでカメラで移動できるようにします。
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      addSatelliteImagery();
      addLandmarkButtons();
      setupControls();
      goHome();
    }

    start();
  </script>
</body>
</html>
