<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>地球・月・火星エクスプローラー</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #panel {
      position: absolute;
      z-index: 2;
      top: 16px;
      left: 16px;
      width: min(320px, calc(100vw - 56px));
      padding: 16px;
      color: #f3f6ff;
      background: rgba(10, 16, 30, .86);
      border: 1px solid rgba(180, 205, 255, .2);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, .4);
      backdrop-filter: blur(12px);
    }
    h1 { margin: 0 0 4px; font-size: 17px; }
    .subtitle { margin: 0 0 14px; color: #aab7d0; font-size: 12px; }
    .section-title {
      margin: 14px 0 7px;
      color: #aab7d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .09em;
    }
    .button-row, #spotButtons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    #spotButtons { grid-template-columns: repeat(2, 1fr); }
    button {
      min-height: 34px;
      padding: 7px 9px;
      color: #eaf0ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(190, 210, 255, .2);
      border-radius: 7px;
    }
    button:hover { background: rgba(130, 170, 255, .2); }
    button.active { background: #2768d8; border-color: #70a5ff; }
    #spotButtons button { text-align: left; }
    .slider-line {
      display: flex;
      justify-content: space-between;
      margin: 12px 0 5px;
      color: #d8e1f5;
      font-size: 12px;
    }
    input[type="range"] { width: 100%; accent-color: #68a1ff; }
    #status { min-height: 16px; margin-top: 10px; color: #aab7d0; font-size: 11px; line-height: 1.4; }
    #status.error { color: #ff9b9b; }
    @media (max-width: 480px) {
      #panel { top: 8px; left: 8px; padding: 12px; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <aside id="panel">
    <h1>惑星エクスプローラー</h1>
    <p class="subtitle">地球・月・火星を切り替えて探索</p>

    <div class="section-title">天体</div>
    <div class="button-row">
      <button type="button" data-body="earth" class="active">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </div>

    <div class="section-title">名所</div>
    <div id="spotButtons"></div>

    <div class="section-title">太陽光・時間</div>
    <div class="slider-line">
      <label for="timeSlider">時刻（UTC）</label>
      <span id="timeLabel">12:00</span>
    </div>
    <input id="timeSlider" type="range" min="0" max="1439" value="720" step="1">
    <div id="status" role="status">初期化しています…</div>
  </aside>

  <script>
    (async function () {
      "use strict";

      /*
       * ブラウザー上のHTMLから、サーバーやGitHub Actionsの環境変数を
       * 直接読むことはできません。HTMLと同じ場所で配信される config.yaml に
       * 次の形式でアクセストークンを設定してください。
       *
       * accesstoken: "Cesium ionのトークン"
       *
       * config.yamlをビルド時に環境変数から生成する場合は、YAMLファイルを
       * 公開する設定にしてください。トークンはブラウザーから見えるため、
       * Cesium ion側で利用制限を設定したトークンを使用してください。
       */

      const CONFIG_URL = "./config.yaml";
      const FALLBACK_TOKEN = "__accesstoken__";

      const WORLD_IMAGERY_ASSET_ID = 2;
      const MOON_ASSET_ID = 2684829;

      // 利用する火星のion画像・地形アセットがある場合はIDを設定してください。
      const MARS_IMAGERY_ASSET_ID = null;
      const MARS_TERRAIN_ASSET_ID = null;

      const statusEl = document.getElementById("status");
      const timeSlider = document.getElementById("timeSlider");
      const timeLabel = document.getElementById("timeLabel");
      const spotButtons = document.getElementById("spotButtons");

      let activeBody = "earth";
      let switchId = 0;
      let moonTileset = null;
      let marsTileset = null;
      let osmBuildings = null;

      function setStatus(message, error) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(error));
      }

      async function loadIonToken() {
        const response = await fetch(CONFIG_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(
            "config.yaml を読み込めません（HTTP " + response.status +
            "）。HTMLと同じ場所に配置してください。"
          );
        }

        const yaml = await response.text();
        const match = yaml.match(
          /^\s*accesstoken\s*:\s*(?:"([^"]*)"|'([^']*)'|([^#\r\n]+))\s*(?:#.*)?$/m
        );
        const token = match && (match[1] || match[2] || match[3])
          ? (match[1] || match[2] || match[3]).trim()
          : FALLBACK_TOKEN;

        if (!token || token === FALLBACK_TOKEN) {
          throw new Error(
            "config.yaml に有効な accesstoken がありません。"
          );
        }

        Cesium.Ion.defaultAccessToken = token;
      }

      const spots = {
        earth: [
          { label: "宇宙全体", lon: 0, lat: 0, height: 22000000 },
          { label: "富士山", lon: 138.7274, lat: 35.3606, height: 18000 },
          { label: "東京スカイツリー", lon: 139.8107, lat: 35.7101, height: 3500 },
          { label: "グランドキャニオン", lon: -112.1129, lat: 36.1069, height: 22000 }
        ],
        moon: [
          { label: "ティコ", lon: -11.2, lat: -43.3, height: 90000 },
          { label: "静かの海", lon: 31.4, lat: 8.5, height: 100000 },
          { label: "コペルニクス", lon: -20.1, lat: 9.7, height: 80000 }
        ],
        mars: [
          { label: "オリンポス山", lon: -133.8, lat: 18.65, height: 150000 },
          { label: "マリネリス峡谷", lon: -59.2, lat: -13.9, height: 180000 },
          { label: "ゲール・クレーター", lon: 137.8, lat: -5.4, height: 45000 }
        ]
      };

      function updateSpotButtons() {
        spotButtons.replaceChildren();
        for (const spot of spots[activeBody]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = spot.label;
          button.addEventListener("click", function () {
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(
                spot.lon, spot.lat, spot.height
              ),
              duration: 2.2
            });
          });
          spotButtons.appendChild(button);
        }
      }

      function removeExtraTilesets() {
        if (moonTileset) {
          viewer.scene.primitives.remove(moonTileset);
          moonTileset = null;
        }
        if (marsTileset) {
          viewer.scene.primitives.remove(marsTileset);
          marsTileset = null;
        }
        if (osmBuildings) {
          viewer.scene.primitives.remove(osmBuildings);
          osmBuildings = null;
        }
      }

      function setAtmosphere(body) {
        const scene = viewer.scene;
        scene.fog.enabled = body !== "moon";

        if (body === "earth") {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
          scene.skyAtmosphere.show = true;
          scene.skyAtmosphere.hueShift = 0;
          scene.skyAtmosphere.saturationShift = 0;
          scene.skyAtmosphere.brightnessShift = 0;
          scene.globe.showGroundAtmosphere = true;
          scene.fog.color = Cesium.Color.fromCssColorString("#b7d8ff");
          scene.fog.density = 0.0002;
        } else if (body === "moon") {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
          scene.skyAtmosphere.show = false;
          scene.globe.showGroundAtmosphere = false;
        } else {
          scene.backgroundColor = Cesium.Color.fromCssColorString("#080403");
          scene.skyAtmosphere.show = true;
          scene.skyAtmosphere.hueShift = 0.92;
          scene.skyAtmosphere.saturationShift = 0.35;
          scene.skyAtmosphere.brightnessShift = -0.18;
          scene.globe.showGroundAtmosphere = true;
          scene.fog.color = Cesium.Color.fromCssColorString("#b95d43");
          scene.fog.density = 0.00035;
        }
      }

      async function switchBody(body) {
        const currentSwitch = ++switchId;
        activeBody = body;

        document.querySelectorAll("[data-body]").forEach(function (button) {
          button.classList.toggle("active", button.dataset.body === body);
        });
        updateSpotButtons();

        removeExtraTilesets();
        viewer.imageryLayers.removeAll(true);
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewer.scene.globe.show = true;
        viewer.scene.globe.enableLighting = true;
        setAtmosphere(body);

        try {
          if (body === "earth") {
            setStatus("地球の衛星画像と地形を読み込んでいます…");

            // 地形と衛星画像は独立して読み込み、画像レイヤーを必ず追加します。
            const imageryPromise = Cesium.IonImageryProvider.fromAssetId(
              WORLD_IMAGERY_ASSET_ID
            );
            const terrainPromise = Cesium.createWorldTerrainAsync({
              requestWaterMask: true,
              requestVertexNormals: true
            });

            const imagery = await imageryPromise;
            if (currentSwitch !== switchId) return;
            viewer.imageryLayers.addImageryProvider(imagery);

            const terrain = await terrainPromise;
            if (currentSwitch !== switchId) return;
            viewer.terrainProvider = terrain;

            try {
              osmBuildings = await Cesium.createOsmBuildingsAsync();
              if (currentSwitch !== switchId) {
                viewer.scene.primitives.remove(osmBuildings);
                osmBuildings = null;
                return;
              }
              viewer.scene.primitives.add(osmBuildings);
            } catch (error) {
              console.warn("OSM Buildings の読み込みに失敗しました:", error);
            }

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 15, 22000000),
              duration: 1.8
            });
            setStatus("地球：衛星画像・Cesium World Terrain を表示中");
          } else if (body === "moon") {
            setStatus("月面アセットを読み込んでいます…");

            try {
              viewer.terrainProvider =
                await Cesium.CesiumTerrainProvider.fromIonAssetId(
                  MOON_ASSET_ID,
                  { requestVertexNormals: true }
                );
            } catch (terrainError) {
              console.warn("月面アセットを地形として読み込めません:", terrainError);
              moonTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
                MOON_ASSET_ID
              );
              if (currentSwitch !== switchId) {
                viewer.scene.primitives.remove(moonTileset);
                moonTileset = null;
                return;
              }
              viewer.scene.primitives.add(moonTileset);
            }

            if (currentSwitch !== switchId) return;
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 0, 12000000),
              duration: 1.8
            });
            setStatus("月：ion 月面アセットを表示中");
          } else {
            setStatus("火星の画像・地形を読み込んでいます…");

            if (MARS_IMAGERY_ASSET_ID) {
              const imagery = await Cesium.IonImageryProvider.fromAssetId(
                MARS_IMAGERY_ASSET_ID
              );
              if (currentSwitch !== switchId) return;
              viewer.imageryLayers.addImageryProvider(imagery);
            }

            if (MARS_TERRAIN_ASSET_ID) {
              try {
                viewer.terrainProvider =
                  await Cesium.CesiumTerrainProvider.fromIonAssetId(
                    MARS_TERRAIN_ASSET_ID,
                    { requestVertexNormals: true }
                  );
              } catch (terrainError) {
                marsTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
                  MARS_TERRAIN_ASSET_ID
                );
                if (currentSwitch !== switchId) {
                  viewer.scene.primitives.remove(marsTileset);
                  marsTileset = null;
                  return;
                }
                viewer.scene.primitives.add(marsTileset);
              }
            }

            if (currentSwitch !== switchId) return;
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 0, 14000000),
              duration: 1.8
            });

            if (!MARS_IMAGERY_ASSET_ID && !MARS_TERRAIN_ASSET_ID) {
              setStatus("火星：ion の火星画像・地形アセットIDが未設定です。");
            } else {
              setStatus("火星：設定した ion アセットを表示中");
            }
          }
        } catch (error) {
          console.error(error);
          setStatus(
            "読み込み失敗: " + (error.message || "ion アセットを取得できません。") +
            " トークン、アセット権限、ネットワークを確認してください。",
            true
          );
        }
      }

      document.querySelectorAll("[data-body]").forEach(function (button) {
        button.addEventListener("click", function () {
          switchBody(button.dataset.body);
        });
      });

      function updateSunTime() {
        const totalMinutes = Number(timeSlider.value);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;

        timeLabel.textContent =
          String(hours).padStart(2, "0") + ":" +
          String(minutes).padStart(2, "0");

        const date = new Date();
        date.setUTCHours(hours, minutes, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(date);
        viewer.scene.requestRender();
      }

      timeSlider.addEventListener("input", updateSunTime);

      let viewer;
      try {
        await loadIonToken();

        viewer = new Cesium.Viewer("cesiumContainer", {
          animation: false,
          baseLayerPicker: false,
          fullscreenButton: false,
          geocoder: false,
          homeButton: false,
          infoBox: false,
          navigationHelpButton: false,
          sceneModePicker: false,
          selectionIndicator: false,
          timeline: false,
          vrButton: false,
          shouldAnimate: false,
          requestRenderMode: false,
          baseLayer: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider()
        });

        viewer.scene.globe.enableLighting = true;
        viewer.scene.globe.showGroundAtmosphere = true;
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.light = new Cesium.SunLight();

        updateSunTime();
        updateSpotButtons();
        await switchBody("earth");
      } catch (error) {
        console.error(error);
        setStatus(
          "初期化失敗: " + (error.message || "設定を確認してください。"),
          true
        );
      }
    })();
  </script>
</body>
</html>
