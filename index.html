<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 14px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .94);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .top-actions {
      margin-left: auto;
    }

    button, select {
      color: var(--text);
      background: rgba(27, 39, 58, .95);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      font: inherit;
    }

    button {
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover, select:hover {
      border-color: rgba(118, 186, 255, .75);
    }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .imagery-control {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      max-width: min(260px, 70vw);
      cursor: pointer;
    }

    select:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 72px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .topbar {
        gap: 7px;
        padding: 6px 8px;
      }

      .brand { font-size: 12px; }
      .top-actions { margin-left: 0; }
      .topbar button,
      .topbar select {
        padding: 6px 8px;
        font-size: 12px;
      }

      .imagery-control {
        font-size: 12px;
      }

      .panel { top: 130px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">PLANET <span>EXPLORER</span></div>

    <nav class="button-row" aria-label="天体の切り替え">
      <button type="button" data-body="earth" class="selected">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </nav>

    <label class="imagery-control" for="imagerySelect">
      地球の画像
      <select id="imagerySelect">
        <option value="satellite">Google Maps 2D Satellite</option>
        <option value="satelliteLabels">Satellite with Labels</option>
        <option value="roadmap">Google Maps 2D Roadmap</option>
        <option value="labels">Google Maps 2D Labels Only</option>
        <option value="contour">Google Maps 2D Contour</option>
      </select>
    </label>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">全体表示</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <div id="cesiumContainer" aria-label="天体の3D表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>データ情報</strong>
      <button type="button" id="closeInfo" aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    const CONFIG = {
      bodies: {
        earth: {
          name: "地球",
          assetId: 2275207,
          dataName: "Google Photorealistic 3D Tiles"
        },
        moon: {
          name: "月",
          assetId: 2684829,
          dataName: "Cesium Moon"
        },
        mars: {
          name: "火星",
          assetId: 3644333,
          dataName: "Cesium Mars"
        }
      },

      imagery: {
        satellite: {
          assetId: 3830182,
          name: "Google Maps 2D Satellite"
        },
        satelliteLabels: {
          assetId: 3830183,
          name: "Google Maps 2D Satellite with Labels"
        },
        roadmap: {
          assetId: 3830184,
          name: "Google Maps 2D Roadmap"
        },
        labels: {
          assetId: 3830185,
          name: "Google Maps 2D Labels Only"
        },
        contour: {
          assetId: 3830186,
          name: "Google Maps 2D Contour"
        }
      }
    };

    const $ = (id) => document.getElementById(id);

    let viewer = null;
    let activeBody = "earth";
    let currentTileset = null;
    let currentImageryLayer = null;
    let tilesetGeneration = 0;
    let imageryGeneration = 0;
    let ionToken = "";

    function setStatus(message) {
      $("status").textContent = message;
    }

    async function fetchIonToken() {
      const response = await fetch("/api/cesium-token", {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`トークンAPIの応答: HTTP ${response.status}`);
      }

      const data = await response.json();

      if (typeof data.token !== "string" || !data.token.trim()) {
        throw new Error("トークンが空です");
      }

      return data.token.trim();
    }

    function updateControls() {
      document.querySelectorAll("[data-body]").forEach((button) => {
        button.classList.toggle(
          "selected",
          button.dataset.body === activeBody
        );
      });

      $("imagerySelect").disabled = activeBody !== "earth";
    }

    function removeCurrentTileset() {
      const tileset = currentTileset;
      currentTileset = null;

      if (tileset && viewer && !tileset.isDestroyed()) {
        viewer.scene.primitives.remove(tileset);
      }
    }

    function removeCurrentImagery() {
      const layer = currentImageryLayer;
      currentImageryLayer = null;

      if (layer && viewer) {
        viewer.imageryLayers.remove(layer, true);
      }
    }

    // 地球全体が画面に入る視点
    function showEarthView() {
      if (!viewer) return;

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(0, 0, 18000000),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0
        },
        duration: 1.2
      });
    }

    function focusTileset(tileset) {
      if (!viewer || !tileset) return;

      const sphere = tileset.boundingSphere;

      if (
        !sphere ||
        !sphere.center ||
        !Number.isFinite(sphere.radius) ||
        sphere.radius <= 0
      ) {
        return;
      }

      viewer.camera.flyToBoundingSphere(sphere, {
        duration: 1.2,
        offset: new Cesium.HeadingPitchRange(
          0,
          Cesium.Math.toRadians(-25),
          Math.max(sphere.radius * 2.8, 1000)
        )
      });
    }

    function goHome() {
      if (!viewer) return;

      if (activeBody === "earth") {
        showEarthView();
      } else if (currentTileset) {
        focusTileset(currentTileset);
      }
    }

    function renderInfo(state = "読み込み中") {
      const body = CONFIG.bodies[activeBody];
      let dataDescription = body.dataName;

      if (activeBody === "earth") {
        const imagery = CONFIG.imagery[$("imagerySelect").value];
        dataDescription += ` / ${imagery.name}`;
      }

      $("infoContent").textContent =
        `天体: ${body.name}。` +
        `データ: ${dataDescription}。` +
        `Asset ID: ${body.assetId}。` +
        `状態: ${state}。`;
    }

    async function loadImagery() {
      if (!viewer || activeBody !== "earth") return;

      const requestId = ++imageryGeneration;
      const imageryKey = $("imagerySelect").value;
      const imageryConfig = CONFIG.imagery[imageryKey];

      if (!imageryConfig) {
        setStatus("画像データの設定を確認してください。");
        return;
      }

      setStatus(`${imageryConfig.name}を読み込み中…`);
      renderInfo("画像読み込み中");

      try {
        const provider = await Cesium.IonImageryProvider.fromAssetId(
          imageryConfig.assetId
        );

        // 読み込み中に別の画像へ切り替えた場合、古い結果を使わない
        if (requestId !== imageryGeneration || activeBody !== "earth") {
          return;
        }

        removeCurrentImagery();
        currentImageryLayer =
          viewer.imageryLayers.addImageryProvider(provider);

        setStatus(`${imageryConfig.name}を読み込みました。`);
        renderInfo("読み込み完了");
      } catch (error) {
        if (requestId !== imageryGeneration) return;

        console.error(`${imageryConfig.name}の読み込みエラー:`, error);
        setStatus(
          `${imageryConfig.name}を読み込めません。` +
          `トークンの権限、Asset ID、アセットへのアクセス設定を確認してください。`
        );
        renderInfo("画像読み込み失敗");
      }
    }

    async function loadActiveTileset() {
      const requestId = ++tilesetGeneration;
      const bodyKey = activeBody;
      const body = CONFIG.bodies[bodyKey];

      removeCurrentTileset();
      updateControls();

      viewer.scene.globe.show = bodyKey === "earth";
      renderInfo("3Dデータ読み込み中");

      setStatus(`${body.dataName}を読み込み中…`);

      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(
          body.assetId
        );

        // 読み込み中に天体が切り替わっていたら、古い結果を破棄
        if (requestId !== tilesetGeneration) {
          if (!tileset.isDestroyed()) {
            tileset.destroy();
          }
          return;
        }

        // 描画負荷を抑えてドラッグを軽くする
        tileset.maximumScreenSpaceError = 16;

        if (tileset.tileFailed) {
          tileset.tileFailed.addEventListener((event) => {
            console.warn(`${body.dataName}のタイル読み込み失敗:`, event);
          });
        }

        viewer.scene.primitives.add(tileset);
        currentTileset = tileset;

        setStatus(`${body.dataName}を読み込みました。`);
        renderInfo("読み込み完了");

        // 月・火星はタイルセットの範囲へ移動。
        // 地球は全体表示の視点を維持する。
        if (bodyKey !== "earth") {
          focusTileset(tileset);
        }
      } catch (error) {
        if (requestId !== tilesetGeneration) return;

        console.error(`${body.dataName}の読み込みエラー:`, error);

        // 3Dデータが失敗しても背景の地球儀は表示する
        viewer.scene.globe.show = true;

        setStatus(
          `${body.dataName}を読み込めません。` +
          `トークンの権限、Asset ID、アセットへのアクセス設定を確認してください。`
        );
        renderInfo("3Dデータ読み込み失敗");
      }
    }

    function setupControls() {
      document.querySelectorAll("[data-body]").forEach((button) => {
        button.addEventListener("click", () => {
          const body = button.dataset.body;
          if (!Object.hasOwn(CONFIG.bodies, body)) return;

          activeBody = body;
          updateControls();

          if (body === "earth") {
            showEarthView();
            loadActiveTileset();
            loadImagery();
          } else {
            // 月・火星では地球の画像レイヤーを非表示にする
            viewer.scene.globe.show = false;
            loadActiveTileset();
          }
        });
      });

      $("imagerySelect").addEventListener("change", () => {
        if (activeBody === "earth") {
          loadImagery();
        }
      });

      $("homeButton").addEventListener("click", goHome);

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
        renderInfo();
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });
    }

    async function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。ネット接続を確認してください。");
        return;
      }

      setStatus("Cesium ionトークンを取得中…");

      try {
        ionToken = await fetchIonToken();
        Cesium.Ion.defaultAccessToken = ionToken;
      } catch (error) {
        console.error("Cesium ionトークンの取得に失敗しました:", error);
        setStatus(
          "トークンを取得できません。Vercelの環境変数を確認してください。"
        );
        return;
      }

      try {
        viewer = new Cesium.Viewer("cesiumContainer", {
          baseLayer: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          animation: false,
          timeline: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          baseLayerPicker: false,
          navigationHelpButton: false,
          fullscreenButton: false,
          infoBox: false,
          selectionIndicator: false,
          useBrowserRecommendedResolution: true
        });
      } catch (error) {
        console.error("Cesium Viewerの初期化エラー:", error);
        setStatus("Cesium Viewerを初期化できませんでした。");
        return;
      }

      viewer.resolutionScale = Math.min(window.devicePixelRatio || 1, 1);

      viewer.scene.globe.show = true;
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");

      const controller = viewer.scene.screenSpaceCameraController;
      controller.enableCollisionDetection = false;
      controller.inertiaSpin = 0.75;
      controller.inertiaTranslate = 0.75;
      controller.inertiaZoom = 0.7;
      controller.maximumMovementRatio = 0.1;

      setupControls();
      updateControls();

      // 初期表示は地球全体
      showEarthView();

      // 初期選択の衛星画像と地球3D Tilesを読み込む
      await Promise.all([
        loadImagery(),
        loadActiveTileset()
      ]);
    }

    start();
  </script>
</body>
</html>
