<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit Atlas — 地球・月・火星</title>

  <!-- CesiumJS 1.127.0をローカル配置 -->
  <link rel="stylesheet" href="./vendor/Cesium/Widgets/widgets.css">
  <link rel="stylesheet" href="./style.css">

  <!-- 任意。Pannellumをローカル配置する場合に使用 -->
  <link rel="stylesheet" href="./vendor/pannellum/pannellum.css">
  <script src="./vendor/Cesium/Cesium.js"></script>
  <script src="./vendor/pannellum/pannellum.js"></script>
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark">◎</div>
        <div>
          <h1>ORBIT ATLAS</h1>
          <p>地球・月・火星を探索</p>
        </div>
      </header>

      <section class="panel">
        <label for="bodySelect">探索する天体</label>
        <select id="bodySelect">
          <option value="earth">地球</option>
          <option value="moon">月</option>
          <option value="mars">火星</option>
        </select>
        <div id="bodyStatus" class="status" role="status">初期化中…</div>
        <div class="button-row">
          <button id="homeButton" type="button">全体表示</button>
          <button id="tiltButton" type="button">傾斜を戻す</button>
        </div>
      </section>

      <section class="panel">
        <label for="searchInput">場所を検索</label>
        <form id="searchForm">
          <input id="searchInput" autocomplete="off"
                 placeholder="都市・住所・地名、または緯度,経度">
          <button type="submit">検索</button>
        </form>
        <p id="searchHint" class="hint"></p>
        <div id="searchResults" class="result-list"></div>
      </section>

      <section class="panel">
        <h2>表示レイヤー</h2>
        <label class="check"><input id="earthTilesToggle" type="checkbox" checked>
          地球 3Dタイル</label>
        <label class="check"><input id="osmToggle" type="checkbox">
          地球 OpenStreetMap</label>
        <label class="check"><input id="quakeToggle" type="checkbox">
          地震（USGS）</label>
        <label class="check"><input id="aqiToggle" type="checkbox">
          AQI（Open-Meteo）</label>
        <label class="check disabled" title="データ提供元が未設定">
          <input type="checkbox" disabled>交通・通行止め（未設定）</label>
        <label class="check disabled" title="路線データが未設定">
          <input type="checkbox" disabled>公共交通路線（未設定）</label>
        <label class="check disabled" title="地域別データが未設定">
          <input type="checkbox" disabled>台風・火災・避難所（未設定）</label>
        <div id="layerStatus" class="hint"></div>
      </section>

      <section class="panel">
        <h2>インドアマップ</h2>
        <select id="facilitySelect">
          <option value="">施設データ未登録</option>
        </select>
        <select id="floorSelect" disabled>
          <option value="">階を選択</option>
        </select>
        <div id="indoorStatus" class="hint">
          出典・利用権限を確認した施設データを登録してください。
        </div>
      </section>

      <section class="panel">
        <h2>保存したピン</h2>
        <div id="pinsList" class="result-list"></div>
      </section>

      <section class="panel">
        <h2>履歴</h2>
        <label class="check"><input id="historyToggle" type="checkbox" checked>
          履歴を保存</label>
        <div class="button-row">
          <button id="clearSearchHistory" type="button">検索履歴を消去</button>
          <button id="clearViewHistory" type="button">閲覧履歴を消去</button>
        </div>
        <div id="historyList" class="result-list"></div>
      </section>

      <section class="panel">
        <h2>ライブビュー</h2>
        <button id="arButton" type="button">カメラ表示を開始</button>
        <div id="arStatus" class="hint">カメラ映像上の簡易表示です。正確なAR位置合わせではありません。</div>
      </section>

      <footer>
        <p>地図・写真・データの出典および利用条件を確認してください。</p>
        <p>Cesiumのクレジット表示を隠さないでください。</p>
      </footer>
    </aside>

    <section class="map-shell">
      <div id="cesiumContainer"></div>
      <div class="map-topbar">
        <span id="activeBodyLabel">地球</span>
        <span id="mapMessage" role="status">読み込み中…</span>
      </div>

      <section id="infoPanel" class="info-panel" aria-live="polite">
        <button id="closeInfo" class="close" type="button" aria-label="閉じる">×</button>
        <h2 id="infoTitle">地点情報</h2>
        <div id="infoContent">地図をクリックして地点を選択します。</div>
      </section>

      <section id="panoramaModal" class="modal hidden">
        <div class="modal-card">
          <div class="modal-header">
            <h2>360度写真</h2>
            <button id="closePanorama" type="button">閉じる</button>
          </div>
          <div id="panoramaViewer"></div>
          <div id="panoramaChoices"></div>
        </div>
      </section>

      <section id="arOverlay" class="ar-overlay hidden">
        <video id="arVideo" autoplay playsinline muted></video>
        <div id="arLabels" class="ar-labels"></div>
        <button id="stopArButton" type="button">カメラを停止</button>
      </section>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
