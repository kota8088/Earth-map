<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px 16px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .94);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand span { color: var(--accent); }
    .top-actions { margin-left: auto; }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: rgba(118, 186, 255, .75); }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .78);
    }

    .landmarks button { flex: 0 0 auto; }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 115px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .topbar { padding: 6px 8px; }
      .brand { font-size: 12px; }
      .top-actions button { padding: 6px 8px; font-size: 12px; }
      .landmarks { top: 50px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">EARTH <span>EXPLORER</span></div>

    <div class="top-actions">
      <button type="button" id="homeButton">全体表示</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>
  <div id="cesiumContainer" aria-label="地球の3D表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>地球のデータ情報</strong>
      <button type="button" id="closeInfo" aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    const ION_TOKEN = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjROZHZWMHdLYXV3SWNwSzIiLCJqdGkiOiI3Yjg5YzUwZC02NTlmLTQzODctYjExYi04MTY4Nzk2NzA0YjEiLCJpZCI6NTEyNjIzLCJzdWIiOiJrb3RhODA4OCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiLlroflrpnjg57jg4Pjg5fnlKgiLCJpYXQiOjE3OTUxMzY0MjV9.IGtfp-6X0Ib5S8z9wby-FfSRu1I_-a2NGKAMVBxkm1I";
    const EARTH_ASSET_ID = 2275207;

    const landmarks = [
      { name: "東京タワー", lon: 139.7454, lat: 35.6586, height: 3500 },
      { name: "エッフェル塔", lon: 2.2945, lat: 48.8584, height: 3500 },
      { name: "自由の女神", lon: -74.0445, lat: 40.6892, height: 4500 }
    ];

    const $ = (id) => document.getElementById(id);

    let viewer;
    let earthTileset = null;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function goHome() {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(0, 15, 20000000),
        duration: 1.2
      });
    }

    function goToLandmark(place) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          place.lon, place.lat, place.height
        ),
        orientation: {
          heading: Cesium.Math.toRadians(15),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2
      });
    }

    function addLandmarkButtons() {
      const container = $("landmarks");

      for (const place of landmarks) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = place.name;
        button.addEventListener("click", () => goToLandmark(place));
        container.appendChild(button);
      }
    }

    function tokenIsConfigured() {
      return ION_TOKEN &&
        !ION_TOKEN.includes("PASTE_RESTRICTED");
    }

    async function loadEarthTiles() {
      if (!tokenIsConfigured()) {
        setStatus("地球の地図を表示中です。3D Tilesを使う場合はionトークンを設定してください。");
        return;
      }

      try {
        Cesium.Ion.defaultAccessToken = ION_TOKEN;
        setStatus("地図を表示中です。地球の3Dデータを読み込んでいます…");

        earthTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
          EARTH_ASSET_ID
        );

        viewer.scene.primitives.add(earthTileset);

        setStatus("地球の地図と3Dデータを表示中です。");
      } catch (error) {
        console.error("地球の3D Tiles読み込みエラー:", error);
        setStatus("地図は表示中ですが、3D Tilesを読み込めませんでした。ionのトークンとアセット権限を確認してください。");
      }
    }

    function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。通信状態を確認してください。");
        return;
      }

      if (tokenIsConfigured()) {
        Cesium.Ion.defaultAccessToken = ION_TOKEN;
      }

      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false
      });

      // 球体に地図画像を貼る。元のコードに無かったのはこの部分です。
      const osmImagery = new Cesium.UrlTemplateImageryProvider({
        url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        credit: "© OpenStreetMap contributors"
      });

      viewer.imageryLayers.addImageryProvider(osmImagery);
      viewer.scene.globe.show = true;
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      addLandmarkButtons();

      $("homeButton").addEventListener("click", goHome);
      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
      });
      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });

      $("infoContent").textContent =
        "地図画像: OpenStreetMap / 地形: Cesium楕円体" +
        (tokenIsConfigured()
          ? " / 3D Tiles: Cesium ion"
          : " / ionトークン未設定のため3D Tilesは未使用");

      goHome();
      loadEarthTiles();
    }

    start();
  </script>
</body>
</html>
