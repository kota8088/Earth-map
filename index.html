<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earth · Moon · Mars Explorer</title>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>
  <style>
    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02040c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #panel {
      position: absolute;
      z-index: 5;
      top: 16px;
      left: 16px;
      width: min(320px, calc(100vw - 56px));
      padding: 16px;
      color: #f3f6ff;
      background: rgba(10, 16, 30, 0.84);
      border: 1px solid rgba(180, 205, 255, 0.2);
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 4px;
      font-size: 17px;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin: 0 0 14px;
      color: #aab7d0;
      font-size: 12px;
    }

    .section-title {
      margin: 14px 0 7px;
      color: #aab7d0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    button {
      min-height: 34px;
      padding: 7px 9px;
      color: #eaf0ff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(190, 210, 255, 0.2);
      border-radius: 7px;
      transition: background 120ms ease, border-color 120ms ease;
    }

    button:hover {
      background: rgba(130, 170, 255, 0.2);
      border-color: rgba(190, 210, 255, 0.52);
    }

    button.active {
      color: #fff;
      background: #2768d8;
      border-color: #70a5ff;
    }

    #spotButtons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }

    #spotButtons button {
      text-align: left;
    }

    .slider-line {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 12px 0 5px;
      color: #d8e1f5;
      font-size: 12px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #68a1ff;
    }

    #status {
      min-height: 16px;
      margin-top: 10px;
      color: #aab7d0;
      font-size: 11px;
      line-height: 1.4;
    }

    #status.error {
      color: #ff9b9b;
    }

    @media (max-width: 480px) {
      #panel {
        top: 8px;
        left: 8px;
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <aside id="panel">
    <h1>惑星エクスプローラー</h1>
    <p class="subtitle">地球・月・火星を切り替えて探索</p>

    <div class="section-title">天体</div>
    <div class="button-row">
      <button type="button" data-body="earth" class="active">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </div>

    <div class="section-title">名所</div>
    <div id="spotButtons"></div>

    <div class="section-title">太陽光・時間</div>
    <div class="slider-line">
      <label for="timeSlider">時刻（UTC）</label>
      <span id="timeLabel">12:00</span>
    </div>
    <input id="timeSlider" type="range" min="0" max="1439" value="720" step="1">

    <div id="status" role="status">初期化しています…</div>
  </aside>

  <script>
    (async function () {
      "use strict";

      // Cesium ion のアセットIDを必要に応じて設定してください。
      // 月の地形アセットIDは ion のアセット構成に合わせて変更できます。
      const MOON_TERRAIN_ASSET_ID = 2684829;

      // 火星の ion アセットがある場合はIDを設定してください。未設定時は楕円体で表示します。
      const MARS_TERRAIN_ASSET_ID = null;
      const MARS_IMAGERY_ASSET_ID = null;

      // Cesium ion の Cesium World Imagery アセットID
      const WORLD_IMAGERY_ASSET_ID = 2;

      const statusEl = document.getElementById("status");
      const timeSlider = document.getElementById("timeSlider");
      const timeLabel = document.getElementById("timeLabel");
      const spotButtons = document.getElementById("spotButtons");

      let activeBody = "earth";
      let switchSequence = 0;
      let moonTileset = null;
      let marsTileset = null;
      let osmBuildings = null;

      function setStatus(message, isError) {
        statusEl.textContent = message;
        statusEl.classList.toggle("error", Boolean(isError));
      }

      async function loadAccessToken() {
        let token = "__accesstoken__";

        try {
          const response = await fetch(".env", { cache: "no-store" });
          if (response.ok) {
            const text = await response.text();
            const match = text.match(
              /^\s*accesstoken\s*=\s*(?:"([^"]*)"|'([^']*)'|([^#\r\n]*))/m
            );

            if (match) {
              token = (match[1] || match[2] || match[3] || "").trim();
            }
          }
        } catch (error) {
          // .env が配信されない環境ではフォールバック値を使用します。
        }

        Cesium.Ion.defaultAccessToken = token || "__accesstoken__";
      }

      await loadAccessToken();

      const viewer = new Cesium.Viewer("cesiumContainer", {
        animation: false,
        baseLayerPicker: false,
        fullscreenButton: false,
        geocoder: false,
        homeButton: false,
        infoBox: false,
        navigationHelpButton: false,
        sceneModePicker: false,
        selectionIndicator: false,
        timeline: false,
        vrButton: false,
        shouldAnimate: false,
        requestRenderMode: false,
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider()
      });

      viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
      viewer.scene.globe.enableLighting = true;
      viewer.scene.globe.showGroundAtmosphere = true;
      viewer.scene.skyAtmosphere.show = true;
      viewer.scene.fog.enabled = true;
      viewer.scene.light = new Cesium.SunLight();

      const spots = {
        earth: [
          { label: "宇宙全体", lon: 0, lat: 0, height: 22000000 },
          { label: "富士山", lon: 138.7274, lat: 35.3606, height: 18000 },
          { label: "東京スカイツリー", lon: 139.8107, lat: 35.7101, height: 3500 },
          { label: "グランドキャニオン", lon: -112.1129, lat: 36.1069, height: 22000 }
        ],
        moon: [
          { label: "ティコ", lon: -11.2, lat: -43.3, height: 90000 },
          { label: "静かの海", lon: 31.4, lat: 8.5, height: 100000 },
          { label: "コペルニクス", lon: -20.1, lat: 9.7, height: 80000 }
        ],
        mars: [
          { label: "オリンポス山", lon: -133.8, lat: 18.65, height: 150000 },
          { label: "マリネリス峡谷", lon: -59.2, lat: -13.9, height: 180000 },
          { label: "ゲール・クレーター", lon: 137.8, lat: -5.4, height: 45000 }
        ]
      };

      function updateSpotButtons() {
        spotButtons.replaceChildren();

        for (const spot of spots[activeBody]) {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = spot.label;
          button.addEventListener("click", function () {
            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(
                spot.lon,
                spot.lat,
                spot.height
              ),
              duration: 2.4
            });
          });
          spotButtons.appendChild(button);
        }
      }

      function clearOptionalTilesets() {
        if (moonTileset) {
          viewer.scene.primitives.remove(moonTileset);
          moonTileset = null;
        }

        if (marsTileset) {
          viewer.scene.primitives.remove(marsTileset);
          marsTileset = null;
        }
      }

      function clearImageryLayers() {
        viewer.imageryLayers.removeAll(true);
      }

      function setEarthAtmosphere() {
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.skyAtmosphere.hueShift = 0;
        viewer.scene.skyAtmosphere.saturationShift = 0;
        viewer.scene.skyAtmosphere.brightnessShift = 0;
        viewer.scene.globe.showGroundAtmosphere = true;
        viewer.scene.fog.enabled = true;
        viewer.scene.fog.color = Cesium.Color.fromCssColorString("#b7d8ff");
        viewer.scene.fog.density = 0.0002;
      }

      function setMoonAtmosphere() {
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#02040c");
        viewer.scene.skyAtmosphere.show = false;
        viewer.scene.globe.showGroundAtmosphere = false;
        viewer.scene.fog.enabled = false;
      }

      function setMarsAtmosphere() {
        viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#080403");
        viewer.scene.skyAtmosphere.show = true;
        viewer.scene.skyAtmosphere.hueShift = 0.92;
        viewer.scene.skyAtmosphere.saturationShift = 0.35;
        viewer.scene.skyAtmosphere.brightnessShift = -0.18;
        viewer.scene.globe.showGroundAtmosphere = true;
        viewer.scene.fog.enabled = true;
        viewer.scene.fog.color = Cesium.Color.fromCssColorString("#b95d43");
        viewer.scene.fog.density = 0.00035;
      }

      async function switchBody(body) {
        const sequence = ++switchSequence;
        activeBody = body;

        document.querySelectorAll("[data-body]").forEach(function (button) {
          button.classList.toggle("active", button.dataset.body === body);
        });

        updateSpotButtons();
        clearOptionalTilesets();
        clearImageryLayers();

        // 切り替え中に前の天体の地形が残らないよう、いったん楕円体へ戻します。
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        viewer.scene.globe.show = true;
        viewer.scene.globe.enableLighting = true;

        try {
          if (body === "earth") {
            setEarthAtmosphere();
            setStatus("地球の地形と衛星画像を読み込んでいます…");

            // 地形と画像を別々に読み込み、片方の失敗がもう片方に影響しないようにします。
            const terrainPromise = Cesium.createWorldTerrainAsync({
              requestWaterMask: true,
              requestVertexNormals: true
            });

            const imageryPromise = Cesium.IonImageryProvider.fromAssetId(
              WORLD_IMAGERY_ASSET_ID
            );

            const terrain = await terrainPromise;
            if (sequence !== switchSequence) return;
            viewer.terrainProvider = terrain;

            try {
              const imagery = await imageryPromise;
              if (sequence !== switchSequence) return;
              viewer.imageryLayers.addImageryProvider(imagery);
            } catch (imageryError) {
              console.error("地球の衛星画像を読み込めませんでした:", imageryError);
              setStatus("地形は読み込みましたが、衛星画像の読み込みに失敗しました。", true);
            }

            if (sequence !== switchSequence) return;

            try {
              osmBuildings = await Cesium.createOsmBuildingsAsync();
              if (sequence !== switchSequence) {
                viewer.scene.primitives.remove(osmBuildings);
                osmBuildings = null;
                return;
              }
              viewer.scene.primitives.add(osmBuildings);
            } catch (buildingError) {
              console.warn("OSM Buildings を読み込めませんでした:", buildingError);
            }

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 15, 22000000),
              duration: 1.8
            });

            setStatus("地球：Cesium World Terrain・衛星画像・OSM Buildings を表示中");
          } else if (body === "moon") {
            setMoonAtmosphere();
            setStatus("月面アセットを読み込んでいます…");

            try {
              // まず ion の地形プロバイダーとして読み込みます。
              const moonTerrain = await Cesium.CesiumTerrainProvider.fromIonAssetId(
                MOON_TERRAIN_ASSET_ID,
                { requestVertexNormals: true }
              );

              if (sequence !== switchSequence) return;
              viewer.terrainProvider = moonTerrain;
            } catch (terrainError) {
              // アセットが地形形式でない場合は 3D Tiles として試します。
              console.warn("月面アセットを地形として読み込めませんでした:", terrainError);

              try {
                moonTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
                  MOON_TERRAIN_ASSET_ID
                );

                if (sequence !== switchSequence) {
                  viewer.scene.primitives.remove(moonTileset);
                  moonTileset = null;
                  return;
                }

                viewer.scene.primitives.add(moonTileset);
              } catch (tilesError) {
                console.error("月面アセットの読み込みに失敗しました:", tilesError);
                throw new Error(
                  "月面アセットを読み込めません。ion のトークンとアセットIDを確認してください。"
                );
              }
            }

            if (sequence !== switchSequence) return;

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 0, 12000000),
              duration: 1.8
            });

            setStatus("月：ion 月面アセットを表示中");
          } else {
            setMarsAtmosphere();
            setStatus("火星を準備しています…");

            if (MARS_IMAGERY_ASSET_ID) {
              const marsImagery = await Cesium.IonImageryProvider.fromAssetId(
                MARS_IMAGERY_ASSET_ID
              );
              if (sequence !== switchSequence) return;
              viewer.imageryLayers.addImageryProvider(marsImagery);
            }

            if (MARS_TERRAIN_ASSET_ID) {
              try {
                const marsTerrain = await Cesium.CesiumTerrainProvider.fromIonAssetId(
                  MARS_TERRAIN_ASSET_ID,
                  { requestVertexNormals: true }
                );
                if (sequence !== switchSequence) return;
                viewer.terrainProvider = marsTerrain;
              } catch (terrainError) {
                marsTileset = await Cesium.Cesium3DTileset.fromIonAssetId(
                  MARS_TERRAIN_ASSET_ID
                );
                if (sequence !== switchSequence) {
                  viewer.scene.primitives.remove(marsTileset);
                  marsTileset = null;
                  return;
                }
                viewer.scene.primitives.add(marsTileset);
              }
            }

            viewer.camera.flyTo({
              destination: Cesium.Cartesian3.fromDegrees(0, 0, 14000000),
              duration: 1.8
            });

            setStatus(
              MARS_TERRAIN_ASSET_ID || MARS_IMAGERY_ASSET_ID
                ? "火星：設定した ion アセットを表示中"
                : "火星：地形アセット未設定のため楕円体で表示中"
            );
          }
        } catch (error) {
          console.error(error);
          setStatus(
            error.message || "読み込みに失敗しました。ion のトークンとアセットIDを確認してください。",
            true
          );
        }
      }

      document.querySelectorAll("[data-body]").forEach(function (button) {
        button.addEventListener("click", function () {
          switchBody(button.dataset.body);
        });
      });

      function updateSunTime() {
        const minutes = Number(timeSlider.value);
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;

        timeLabel.textContent =
          String(hours).padStart(2, "0") + ":" + String(mins).padStart(2, "0");

        const date = new Date();
        date.setUTCHours(hours, mins, 0, 0);
        viewer.clock.currentTime = Cesium.JulianDate.fromDate(date);
        viewer.scene.requestRender();
      }

      timeSlider.addEventListener("input", updateSunTime);
      updateSunTime();
      updateSpotButtons();
      await switchBody("earth");
    })();
  </script>
</body>
</html>
