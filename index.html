<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      min-height: 56px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .92);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .top-actions { margin-left: auto; }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: rgba(118, 186, 255, .75); }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .74);
    }

    .landmarks button { flex: 0 0 auto; }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(720px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 120px;
      right: 12px;
      width: min(360px, calc(100vw - 24px));
      max-height: calc(100vh - 145px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .close-button {
      padding: 1px 9px;
      font-size: 20px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 700px) {
      .top-actions { margin-left: 0; }
      .top-actions button { padding: 6px 8px; }
      .landmarks { top: 100px; }
      .panel { top: 150px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">PLANET <span>EXPLORER</span></div>

    <nav id="bodySwitch" class="button-row" aria-label="天体の切り替え">
      <button type="button" data-body="earth" class="selected">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </nav>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">天体全体へ</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>
  <div id="cesiumContainer" aria-label="3D天体表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>Cesium ion データ情報</strong>
      <button type="button" class="close-button" id="closeInfo"
        aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    /*
     * 必ず自分のCesium ionトークンに置き換えてください。
     * 公開サイトで使う場合は、ion側で利用ドメインを制限してください。
     */
    const CONFIG = {
      ionToken: "PASTE_RESTRICTED_CESIUM_ION_TOKEN_HERE",

      /*
       * ここには各天体の「全球画像」アセットIDを設定してください。
       * IDが3D TilesやTerrainの場合、このコードでは表面画像として表示できません。
       */
      assets: {
        earth: 2275207,
        moon: 2684829,
        mars: 3644333
      },

      ellipsoidRadii: {
        earth: [6378137, 6378137, 6356752.314245],
        moon:  [1737400, 1737400, 1737400],
        mars:  [3396190, 3396190, 3376200]
      }
    };

    const BODIES = {
      earth: { label: "地球", home: [139.7, 35.7, 24000000] },
      moon:  { label: "月",   home: [0, 0, 6500000] },
      mars:  { label: "火星", home: [0, 0, 12000000] }
    };

    const LANDMARKS = [
      {
        body: "earth", name: "東京タワー",
        lon: 139.7454, lat: 35.6586, height: 1700
      },
      {
        body: "earth", name: "エッフェル塔",
        lon: 2.2945, lat: 48.8584, height: 1700
      },
      {
        body: "earth", name: "自由の女神",
        lon: -74.0445, lat: 40.6892, height: 2200
      },
      {
        body: "moon", name: "ティコ",
        lon: 43.31, lat: -11.36, height: 150000
      },
      {
        body: "moon", name: "コペルニクス",
        lon: -20.08, lat: 9.62, height: 130000
      },
      {
        body: "mars", name: "オリンポス山",
        lon: -133.8, lat: 18.65, height: 1200000
      },
      {
        body: "mars", name: "マリネリス峡谷",
        lon: -59.2, lat: -13.9, height: 1800000
      }
    ];

    const $ = (id) => document.getElementById(id);

    let viewer;
    let activeBody = "earth";
    let generation = 0;
    let imageryLayer = null;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function ellipsoidFor(body) {
      return new Cesium.Ellipsoid(...CONFIG.ellipsoidRadii[body]);
    }

    function normalizeLongitude(longitude) {
      return ((longitude + 180) % 360 + 360) % 360 - 180;
    }

    function isTokenMissing() {
      return !CONFIG.ionToken ||
        CONFIG.ionToken.includes("PASTE_RESTRICTED");
    }

    function createViewer() {
      Cesium.Ion.defaultAccessToken = CONFIG.ionToken;

      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        shouldAnimate: true
      });

      viewer.scene.globe.ellipsoid = ellipsoidFor(activeBody);
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#111722");
      viewer.scene.globe.show = true;
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      flyHome(0);

      viewer.screenSpaceEventHandler.setInputAction(
        handleMapClick,
        Cesium.ScreenSpaceEventType.LEFT_CLICK
      );
    }

    function removeImagery() {
      if (imageryLayer) {
        viewer.imageryLayers.remove(imageryLayer, true);
        imageryLayer = null;
      }
    }

    async function loadBodyImagery(body, requestGeneration) {
      removeImagery();
      viewer.scene.globe.ellipsoid = ellipsoidFor(body);

      if (isTokenMissing()) {
        setStatus(
          "Cesium ionトークンが未設定です。CONFIG.ionTokenを設定してください。"
        );
        renderInfo();
        return;
      }

      const assetId = CONFIG.assets[body];
      setStatus(`${BODIES[body].label}: Cesium ionアセットを確認中…`);

      try {
        const endpointUrl = new URL(
          `https://api.cesium.com/v1/assets/${encodeURIComponent(assetId)}/endpoint`
        );
        endpointUrl.searchParams.set("access_token", CONFIG.ionToken);

        const response = await fetch(endpointUrl);

        if (!response.ok) {
          throw new Error(`ion API HTTP ${response.status}`);
        }

        const endpoint = await response.json();

        if (requestGeneration !== generation) return;

        const type = String(endpoint.type || "").toUpperCase();

        if (type !== "IMAGERY") {
          setStatus(
            `${BODIES[body].label}: Asset ID ${assetId} の種類は「${type || "不明"}」です。` +
            "表面表示には全球を覆うIMAGERYアセットが必要です。"
          );
          renderInfo(type || "不明");
          return;
        }

        const provider = await Cesium.IonImageryProvider.fromAssetId(assetId);

        if (requestGeneration !== generation) {
          if (provider && typeof provider.destroy === "function") {
            provider.destroy();
          }
          return;
        }

        imageryLayer = viewer.imageryLayers.addImageryProvider(provider);
        imageryLayer.show = true;
        imageryLayer.alpha = 1;

        setStatus(
          `${BODIES[body].label}: Cesium ionの画像を読み込みました。`
        );
        renderInfo("IMAGERY");
      } catch (error) {
        if (requestGeneration !== generation) return;

        console.error(error);
        const text = String(error.message || error);
        const authError = /401|403/.test(text);

        setStatus(
          `${BODIES[body].label}: ionアセットを読み込めません。` +
          (authError
            ? "トークンまたはアセットの利用権限を確認してください。"
            : "通信状態、Asset ID、アセット設定を確認してください。") +
          ` (${text})`
        );
        renderInfo("読み込み失敗");
      }
    }

    function flyHome(duration = 1.5) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          ...BODIES[activeBody].home,
          ellipsoidFor(activeBody)
        ),
        duration
      });
    }

    function renderLandmarks() {
      const container = $("landmarks");
      container.replaceChildren();

      LANDMARKS
        .filter((item) => item.body === activeBody)
        .forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = item.name;
          button.addEventListener("click", () => goToLandmark(item));
          container.appendChild(button);
        });
    }

    function goToLandmark(item) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          normalizeLongitude(item.lon),
          item.lat,
          item.height,
          ellipsoidFor(item.body)
        ),
        orientation: {
          heading: Cesium.Math.toRadians(15),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2
      });
    }

    function renderInfo(type = "未確認") {
      $("infoContent").innerHTML = `
        <p><strong>${BODIES[activeBody].label}</strong></p>
        <p>Cesium ion Asset ID: ${CONFIG.assets[activeBody]}</p>
        <p>アセット種別: ${type}</p>
        <p>
          表面全体を表示するには、その天体の全球画像に対応した
          ion IMAGERYアセットが必要です。3D Tilesアセットは、
          全球画像の代わりにはなりません。
        </p>
        <p>
          月・火星の半径と、アセットの座標系・経度規約が一致するかも
          ionのアセット詳細で確認してください。
        </p>
      `;
    }

    function switchBody(body) {
      if (!BODIES[body]) return;

      activeBody = body;
      generation++;

      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.classList.toggle("selected", button.dataset.body === body);
      });

      viewer.scene.globe.ellipsoid = ellipsoidFor(body);
      renderLandmarks();
      flyHome();

      loadBodyImagery(body, generation);
    }

    function handleMapClick(event) {
      const ray = viewer.camera.getPickRay(event.position);
      if (!ray) return;

      const position = viewer.scene.globe.pick(ray, viewer.scene);
      if (!Cesium.defined(position)) return;

      const cartographic =
        ellipsoidFor(activeBody).cartesianToCartographic(position);

      if (!cartographic) return;

      const lon = Cesium.Math.toDegrees(cartographic.longitude).toFixed(5);
      const lat = Cesium.Math.toDegrees(cartographic.latitude).toFixed(5);

      setStatus(
        `${BODIES[activeBody].label} · 緯度 ${lat}° · 経度 ${lon}°`
      );
    }

    function setupControls() {
      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.addEventListener("click", () => {
          switchBody(button.dataset.body);
        });
      });

      $("homeButton").addEventListener("click", () => flyHome());

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
        renderInfo();
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });
    }

    function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。通信状態を確認してください。");
        return;
      }

      createViewer();
      setupControls();
      renderLandmarks();
      renderInfo();

      loadBodyImagery(activeBody, generation);
    }

    start();
  </script>
</body>
</html>
