<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 16px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .94);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .top-actions { margin-left: auto; }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: rgba(118, 186, 255, .75); }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .78);
    }

    .landmarks button { flex: 0 0 auto; }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(720px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 120px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      max-height: calc(100vh - 145px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .close-button {
      padding: 1px 9px;
      font-size: 20px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .panel-row { margin: 10px 0; }

    @media (max-width: 700px) {
      .topbar {
        gap: 7px;
        padding: 6px 8px;
      }

      .brand { font-size: 12px; }
      .top-actions { margin-left: 0; }

      .top-actions button {
        padding: 6px 8px;
        font-size: 12px;
      }

      .landmarks { top: 100px; }
      .panel { top: 150px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">PLANET <span>EXPLORER</span></div>

    <nav id="bodySwitch" class="button-row" aria-label="天体の切り替え">
      <button type="button" data-body="earth" class="selected">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </nav>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">天体全体へ</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>
  <div id="cesiumContainer" aria-label="3D天体表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>Cesium ion データ情報</strong>
      <button
        type="button"
        class="close-button"
        id="closeInfo"
        aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    const CONFIG = {
      // 自分のCesium ionトークンに置き換えてください。
      ionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkswWDFiMmx5U0pvQXNiaDIiLCJqdGkiOiI3Yjg5YzUwZC02NTlmLTQzODctYjExYi04MTY4Nzk2NzA0YjEiLCJpZCI6NTEyNjIzLCJzdWIiOiJrb3RhODA4OCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiLlroflrpnjg57jg4Pjg5fnlKgiLCJpYXQiOjE3OTUxMzAzMjZ9.UCtms3W599MMOAhQUHoufqFIV8h8718ranR3wF1K4l0",

      // ご提示のCesium ion 3D TilesアセットID
      assets: {
        earth: 2275207, // Google Photorealistic 3D Tiles
        moon: 2684829,  // Cesium Moon
        mars: 3644333   // Cesium Mars
      },

      // カメラ位置計算に使う半径。実際のデータ座標系と合うかは要確認。
      ellipsoidRadii: {
        earth: [6378137, 6378137, 6356752.314245],
        moon:  [1737400, 1737400, 1737400],
        mars:  [3396190, 3396190, 3376200]
      }
    };

    const BODIES = {
      earth: {
        label: "地球",
        home: [139.7, 35.7, 18000000]
      },
      moon: {
        label: "月",
        home: [0, 0, 6500000]
      },
      mars: {
        label: "火星",
        home: [0, 0, 12000000]
      }
    };

    const LANDMARKS = [
      {
        body: "earth",
        name: "東京タワー",
        lon: 139.7454,
        lat: 35.6586,
        height: 3500
      },
      {
        body: "earth",
        name: "エッフェル塔",
        lon: 2.2945,
        lat: 48.8584,
        height: 3500
      },
      {
        body: "earth",
        name: "自由の女神",
        lon: -74.0445,
        lat: 40.6892,
        height: 4500
      },
      {
        body: "moon",
        name: "ティコ",
        lon: 43.31,
        lat: -11.36,
        height: 250000
      },
      {
        body: "moon",
        name: "コペルニクス",
        lon: -20.08,
        lat: 9.62,
        height: 220000
      },
      {
        body: "moon",
        name: "雨の海",
        lon: -15.6,
        lat: 32.8,
        height: 650000
      },
      {
        body: "mars",
        name: "オリンポス山",
        lon: -133.8,
        lat: 18.65,
        height: 1500000
      },
      {
        body: "mars",
        name: "マリネリス峡谷",
        lon: -59.2,
        lat: -13.9,
        height: 2000000
      },
      {
        body: "mars",
        name: "ゲール・クレーター",
        lon: 137.8,
        lat: -5.4,
        height: 500000
      }
    ];

    const $ = (id) => document.getElementById(id);

    let viewer = null;
    let activeBody = "earth";
    let generation = 0;
    let currentTileset = null;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function ellipsoidFor(body) {
      return new Cesium.Ellipsoid(...CONFIG.ellipsoidRadii[body]);
    }

    function normalizeLongitude(longitude) {
      return ((longitude + 180) % 360 + 360) % 360 - 180;
    }

    function tokenIsMissing() {
      return !CONFIG.ionToken ||
        CONFIG.ionToken.includes("PASTE_RESTRICTED");
    }

    function removeCurrentTileset() {
      if (!currentTileset) return;

      try {
        viewer.scene.primitives.remove(currentTileset);
      } catch (error) {
        console.warn("3D Tilesの削除時に警告が発生しました:", error);
      }

      currentTileset = null;
    }

    function setCameraHome(duration = 1.5) {
      const body = BODIES[activeBody];

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          body.home[0],
          body.home[1],
          body.home[2],
          ellipsoidFor(activeBody)
        ),
        duration
      });
    }

    async function loadBodyTiles(body, requestGeneration) {
      removeCurrentTileset();

      if (tokenIsMissing()) {
        setStatus(
          "Cesium ionトークンが未設定です。CONFIG.ionTokenを設定してください。"
        );
        renderInfo();
        return;
      }

      const assetId = CONFIG.assets[body];
      setStatus(`${BODIES[body].label}: Cesium ion 3D Tilesを読み込み中…`);

      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(assetId);

        // 読み込み中に別の天体へ切り替わった場合は、古い結果を破棄。
        if (requestGeneration !== generation) {
          tileset.destroy();
          return;
        }

        currentTileset = tileset;
        tileset.maximumScreenSpaceError = 16;
        viewer.scene.primitives.add(tileset);

        setStatus(
          `${BODIES[body].label}: Cesium ion 3D Tilesを読み込みました。`
        );
        renderInfo();
      } catch (error) {
        if (requestGeneration !== generation) return;

        console.error(error);
        const message = String(error.message || error);
        const authError = /401|403/.test(message);

        setStatus(
          `${BODIES[body].label}: 3D Tilesを読み込めません。` +
          (authError
            ? "トークン、アセットの利用権限、ドメイン制限を確認してください。"
            : "通信状態とionアセットの設定を確認してください。") +
          ` (${message})`
        );
        renderInfo("読み込み失敗");
      }
    }

    function renderLandmarks() {
      const container = $("landmarks");
      container.replaceChildren();

      LANDMARKS
        .filter((landmark) => landmark.body === activeBody)
        .forEach((landmark) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = landmark.name;
          button.addEventListener("click", () => goToLandmark(landmark));
          container.appendChild(button);
        });
    }

    function goToLandmark(landmark) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          normalizeLongitude(landmark.lon),
          landmark.lat,
          landmark.height,
          ellipsoidFor(landmark.body)
        ),
        orientation: {
          heading: Cesium.Math.toRadians(15),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2
      });
    }

    function renderInfo(loadState = "3D Tiles") {
      const body = BODIES[activeBody];

      $("infoContent").innerHTML = `
        <div class="panel-row">
          <strong>${body.label}</strong>
        </div>
        <div class="panel-row">
          ion Asset ID: ${CONFIG.assets[activeBody]}<br>
          データ形式: Cesium ion 3D Tiles<br>
          読み込み状態: ${loadState}
        </div>
        <div class="panel-row">
          3D Tilesは画像レイヤーではなく、タイル状に配信される3Dデータです。
          このコードではCesium ionから取得したタイルセットを表示しています。
        </div>
        <div class="panel-row">
          カメラ位置や月・火星の座標がデータの座標系と合わない場合、
          タイルセットが見えないことがあります。ionのアセット詳細で
          範囲と座標系も確認してください。
        </div>
      `;
    }

    function switchBody(body) {
      if (!BODIES[body]) return;

      activeBody = body;
      generation++;

      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.classList.toggle(
          "selected",
          button.dataset.body === body
        );
      });

      viewer.scene.globe.ellipsoid = ellipsoidFor(body);

      renderLandmarks();
      renderInfo("読み込み中");

      // 先にカメラを切り替え、対象のionアセットを読み込む。
      setCameraHome();
      loadBodyTiles(body, generation);
    }

    function setupControls() {
      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.addEventListener("click", () => {
          switchBody(button.dataset.body);
        });
      });

      $("homeButton").addEventListener("click", () => {
        setCameraHome();
      });

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
        renderInfo();
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });
    }

    function createViewer() {
      Cesium.Ion.defaultAccessToken = CONFIG.ionToken;

      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        shouldAnimate: true
      });

      viewer.scene.globe.ellipsoid = ellipsoidFor(activeBody);
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");
      viewer.scene.globe.enableLighting = false;
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      setCameraHome(0);
    }

    function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。通信状態を確認してください。");
        return;
      }

      createViewer();
      setupControls();
      renderLandmarks();
      renderInfo();

      loadBodyTiles(activeBody, generation);
    }

    start();
  </script>
</body>
</html>
