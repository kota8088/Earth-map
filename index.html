<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Explorer</title>

  <!-- 単一HTMLで配信するため、CesiumJS 1.127.0をCDNから読み込みます。 -->
  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.127/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .94);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 8px 14px;
      background: linear-gradient(180deg, rgba(5, 9, 16, .97), rgba(5, 9, 16, .78));
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .top-actions { margin-left: auto; }

    button {
      color: var(--text);
      background: rgba(27, 39, 58, .9);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { border-color: rgba(118, 186, 255, .75); }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .landmarks {
      position: absolute;
      z-index: 9;
      top: 57px;
      left: 0;
      right: 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 9px 12px;
      background: rgba(7, 12, 21, .74);
      scrollbar-width: thin;
    }

    .landmarks button { flex: 0 0 auto; }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 22px;
      max-width: min(650px, calc(100vw - 24px));
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .hint {
      position: absolute;
      z-index: 5;
      right: 12px;
      bottom: 22px;
      padding: 8px 10px;
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 120px;
      right: 12px;
      width: min(360px, calc(100vw - 24px));
      max-height: calc(100vh - 145px);
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel.feature {
      top: auto;
      right: auto;
      left: 12px;
      bottom: 62px;
      width: min(380px, calc(100vw - 24px));
      max-height: 48vh;
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .close-button {
      padding: 1px 9px;
      font-size: 20px;
    }

    .panel-row { margin: 10px 0; }

    .panel-row label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
    }

    input, textarea {
      width: 100%;
      color: var(--text);
      background: #0a1220;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px;
      font: inherit;
    }

    textarea {
      min-height: 65px;
      resize: vertical;
    }

    .subtle, .coordinates {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .pin-item {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
    }

    .pin-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .pin-item button { padding: 5px 8px; }

    .cesium-viewer .cesium-widget-credits {
      background: rgba(0, 0, 0, .58);
    }

    @media (max-width: 700px) {
      .topbar {
        flex-wrap: wrap;
        gap: 7px;
        padding: 6px 8px;
      }

      .brand { font-size: 12px; }
      .top-actions { margin-left: 0; }

      .top-actions button {
        padding: 6px 8px;
        font-size: 12px;
      }

      .landmarks { top: 96px; }
      .panel { top: 148px; }
      .hint { display: none; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">PLANET <span>EXPLORER</span></div>

    <nav id="bodySwitch" class="button-row" aria-label="天体の切り替え">
      <button type="button" data-body="earth" class="selected">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </nav>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">天体全体へ</button>
      <button type="button" id="layersButton">データ情報</button>
      <button type="button" id="pinsButton">保存ピン</button>
    </div>
  </header>

  <nav id="landmarks" class="landmarks" aria-label="名所"></nav>

  <div id="cesiumContainer" aria-label="3D天体表示"></div>

  <div id="status" class="status" role="status">初期化中…</div>
  <div class="hint">地表をクリックしてピンを作成</div>

  <section id="featurePanel" class="panel feature" hidden></section>

  <aside id="layersPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>データ情報・追加機能</strong>
      <button type="button" class="close-button" data-close="layersPanel" aria-label="閉じる">×</button>
    </div>
    <div id="layersContent"></div>
  </aside>

  <aside id="pinsPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>保存ピン</strong>
      <button type="button" class="close-button" data-close="pinsPanel" aria-label="閉じる">×</button>
    </div>
    <div id="pinsContent"></div>
  </aside>

  <script>
    "use strict";

    /*
     * Cesium ionのブラウザー用トークンを設定してください。
     * 公開ページでは閲覧者から見えるため、利用ドメイン制限を設定してください。
     */
    const CONFIG = {
      ionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IkswWDFiMmx5U0pvQXNiaDIiLCJqdGkiOiI3Yjg5YzUwZC02NTlmLTQzODctYjExYi04MTY4Nzk2NzA0YjEiLCJpZCI6NTEyNjIzLCJzdWIiOiJrb3RhODA4OCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiLlroflrpnjg57jg4Pjg5fnlKgiLCJpYXQiOjE3OTUxMzAzMjZ9.UCtms3W599MMOAhQUHoufqFIV8h8718ranR3wF1K4l0",
      assets: {
        earth: 2275207,
        moon: 2684829,
        mars: 3644333
      },

      /*
       * 月・火星の半径は仮の表示設定です。
       * 指定アセットのメタデータと座標系を確認して、必要なら変更してください。
       */
      ellipsoidRadii: {
        earth: [6378137, 6378137, 6356752.314245],
        moon:  [1737400, 1737400, 1737400],
        mars:  [3396190, 3396190, 3376200]
      }
    };

    const BODIES = {
      earth: {
        label: "地球",
        home: [139.7, 35.7, 24000000]
      },
      moon: {
        label: "月",
        home: [0, 0, 6500000]
      },
      mars: {
        label: "火星",
        home: [0, 0, 12000000]
      }
    };

    /*
     * 経度は東経を正として記載。
     * ここにあるカメラ高度等は初期設定であり、
     * 指定アセット上での位置・表示品質を検証済みという意味ではありません。
     */
    const LANDMARKS = [
      {
        id: "tokyo-tower", body: "earth", name: "東京タワー",
        description: "東京の展望塔。",
        lon: 139.7454, lat: 35.6586, height: 1700,
        heading: 15, pitch: -38,
        source: "https://www.tokyotower.co.jp/"
      },
      {

        description: "パリの鉄塔。",
        lon: 2.2945, lat: 48.8584, height: 1700,
        heading: 20, pitch: -38,
        source: "https://www.toureiffel.paris/en"
      },
      {
        id: "statue-of-liberty", body: "earth", name: "自由の女神",
        description: "ニューヨーク港にある自由の女神像。",
        lon: -74.0445, lat: 40.6892, height: 2200,
        heading: 35, pitch: -38,
        source: "https://www.nps.gov/stli/"
      },
      {
        id: "colosseum", body: "earth", name: "コロッセオ",
        description: "古代ローマの円形闘技場。",
        lon: 12.4922, lat: 41.8902, height: 1500,
        heading: 25, pitch: -42,
        source: "https://colosseo.it/en/"
      },
      {
        id: "giza", body: "earth", name: "ギザのピラミッド",
        description: "ギザ台地のピラミッド群。",
        lon: 31.1342, lat: 29.9792, height: 7000,
        heading: 30, pitch: -42,
        source: "https://whc.unesco.org/en/list/86/"
      },
      {
        id: "tycho", body: "moon", name: "ティコ",
        description: "月の南半球にある大きなクレーター。",
        lon: 43.31, lat: -11.36, height: 150000,
        heading: 15, pitch: -45,
        source: "https://planetarynames.wr.usgs.gov/"
      },
      {
        id: "copernicus", body: "moon", name: "コペルニクス",
        description: "月面の顕著なクレーター。",
        lon: -20.08, lat: 9.62, height: 130000,
        heading: 20, pitch: -45,
        source: "https://planetarynames.wr.usgs.gov/"
      },
      {
        id: "mare-imbrium", body: "moon", name: "雨の海",
        description: "月面北西部の広い衝突盆地。",
        lon: -15.6, lat: 32.8, height: 500000,
        heading: 0, pitch: -55,
        source: "https://planetarynames.wr.usgs.gov/"
      },
      {
        id: "olympus-mons", body: "mars", name: "オリンポス山",
        description: "火星の巨大な楯状火山。",
        lon: -133.8, lat: 18.65, height: 1200000,
        heading: 15, pitch: -52,
        source: "https://science.nasa.gov/mars/"
      },
      {
        id: "valles-marineris", body: "mars", name: "マリネリス峡谷",
        description: "火星の大規模な峡谷地形。",
        lon: -59.2, lat: -13.9, height: 1800000,
        heading: 20, pitch: -55,
        source: "https://science.nasa.gov/mars/"
      },
      {
        id: "gale-crater", body: "mars", name: "ゲール・クレーター",
        description: "探査車Curiosityの着陸地点を含むクレーター。",
        lon: 137.8, lat: -5.4, height: 350000,
        heading: 15, pitch: -48,
        source: "https://mars.nasa.gov/msl/"
      }
    ];

    const $ = (id) => document.getElementById(id);

    let viewer = null;
    let activeBody = "earth";
    let generation = 0;
    let cameraRequest = 0;
    let currentLayer = null;
    let currentLayerType = "未読込";
    let assetPromises = new Map();
    let db = null;
    let pins = [];
    let pinEntities = new Map();

    function setStatus(message) {
      $("status").textContent = message;
    }

    function ellipsoidFor(body) {
      return new Cesium.Ellipsoid(...CONFIG.ellipsoidRadii[body]);
    }

    function normalizeLongitude(longitude) {
      return ((longitude + 180) % 360 + 360) % 360 - 180;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function escapeAttribute(value) {
      return escapeHtml(value);
    }

    function createViewer() {
      Cesium.Ion.defaultAccessToken = CONFIG.ionToken;

      viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: false,
        terrainProvider: new Cesium.EllipsoidTerrainProvider(),
        animation: false,
        timeline: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        infoBox: false,
        selectionIndicator: false,
        shouldAnimate: true
      });

      viewer.scene.globe.ellipsoid = ellipsoidFor(activeBody);
      viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#111722");
      viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;

      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(
          ...BODIES.earth.home,
          ellipsoidFor("earth")
        )
      });

      viewer.screenSpaceEventHandler.setInputAction(
        handleMapClick,
        Cesium.ScreenSpaceEventType.LEFT_CLICK
      );
    }

    function removeCurrentLayer() {
      if (!currentLayer) return;

      try {
        if (currentLayer.kind === "tiles") {
          viewer.scene.primitives.remove(currentLayer.value);
        } else if (currentLayer.kind === "imagery") {
          viewer.imageryLayers.remove(currentLayer.value, true);
        }
      } catch (error) {
        console.warn("レイヤー解放時の警告:", error);
      }

      currentLayer = null;
      currentLayerType = "未読込";
      viewer.scene.globe.terrainProvider =
        new Cesium.EllipsoidTerrainProvider();
    }

    async function loadBodyAsset(body, requestGeneration) {
      removeCurrentLayer();
      viewer.scene.globe.ellipsoid = ellipsoidFor(body);

      if (!CONFIG.ionToken ||
          CONFIG.ionToken.includes("PASTE_RESTRICTED")) {
        setStatus("Cesium ionトークンが未設定です。HTML内のCONFIG.ionTokenを設定してください。");
        return;
      }

      setStatus(`${BODIES[body].label}: ionアセットの種類を確認中…`);

      try {
        const endpointUrl =
          "https://api.cesium.com/v1/assets/" +
          encodeURIComponent(CONFIG.assets[body]) +
          "/endpoint?access_token=" +
          encodeURIComponent(CONFIG.ionToken);

        const response = await fetch(endpointUrl);

        if (!response.ok) {
          throw new Error(`ion API HTTP ${response.status}`);
        }

        const endpoint = await response.json();
        if (requestGeneration !== generation) return;

        const type = String(endpoint.type || "").toUpperCase();

        if (type === "3DTILES" ||
            type === "3D_TILES" ||
            type === "3D_TILE") {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(
            CONFIG.assets[body]
          );

          if (requestGeneration !== generation) {
            tileset.destroy();
            return;
          }

          viewer.scene.primitives.add(tileset);
          currentLayer = { kind: "tiles", value: tileset };
          currentLayerType = "3D Tiles";
        } else if (type === "IMAGERY") {
          const provider = await Cesium.IonImageryProvider.fromAssetId(
            CONFIG.assets[body]
          );

          if (requestGeneration !== generation) return;

          const imageryLayer =
            viewer.imageryLayers.addImageryProvider(provider);

          currentLayer = { kind: "imagery", value: imageryLayer };
          currentLayerType = "画像";
        } else if (type === "TERRAIN") {
          const resource =
            await Cesium.IonResource.fromAssetId(CONFIG.assets[body]);

          const terrainProvider =
            await Cesium.CesiumTerrainProvider.fromUrl(resource);

          if (requestGeneration !== generation) return;

          viewer.scene.globe.terrainProvider = terrainProvider;
          currentLayer = { kind: "terrain", value: terrainProvider };
          currentLayerType = "地形";
        } else {
          currentLayerType = `未対応の種類: ${type || "不明"}`;
          setStatus(
            `${BODIES[body].label}: アセット種別「${type || "不明"}」はこの実装では未対応です。`
          );
          renderLayersPanel();
          return;
        }

        if (requestGeneration !== generation) return;

        setStatus(
          `${BODIES[body].label}: ${currentLayerType}を読み込みました。範囲・座標系・解像度はionのアセット詳細で確認してください。`
        );
        renderLayersPanel();
      } catch (error) {
        if (requestGeneration !== generation) return;

        console.error(error);
        const message = /401|403/.test(String(error))
          ? "認証失敗またはアセット利用権限がありません。"
          : "通信失敗またはアセット読み込み失敗です。";

        currentLayerType = "読み込み失敗";
        setStatus(`${BODIES[body].label}: ${message} ${error.message}`);
        renderLayersPanel();
      }
    }

    function renderLandmarks() {
      const container = $("landmarks");
      container.replaceChildren();

      LANDMARKS
        .filter((landmark) => landmark.body === activeBody)
        .forEach((landmark) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = landmark.name;
          button.dataset.landmarkId = landmark.id;
          button.addEventListener("click", () => goToLandmark(landmark));
          container.appendChild(button);
        });
    }

    function markSelectedLandmark(id) {
      document.querySelectorAll("#landmarks button").forEach((button) => {
        button.classList.toggle(
          "selected",
          button.dataset.landmarkId === id
        );
      });
    }

    async function goToLandmark(landmark) {
      const requestGeneration = generation;
      const thisCameraRequest = ++cameraRequest;

      markSelectedLandmark(landmark.id);
      showLandmarkInfo(landmark);

      const assetPromise = assetPromises.get(requestGeneration);
      if (assetPromise) await assetPromise;

      // 切り替え後、または別の名所ボタンが押された後なら移動しない。
      if (requestGeneration !== generation ||
          thisCameraRequest !== cameraRequest) {
        return;
      }

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          normalizeLongitude(landmark.lon),
          landmark.lat,
          landmark.height,
          ellipsoidFor(landmark.body)
        ),
        orientation: {
          heading: Cesium.Math.toRadians(landmark.heading),
          pitch: Cesium.Math.toRadians(landmark.pitch),
          roll: 0
        },
        duration: 2.2
      });
    }

    function showLandmarkInfo(landmark) {
      const panel = $("featurePanel");
      panel.hidden = false;
      panel.innerHTML = `
        <div class="panel-heading">
          <strong>${escapeHtml(landmark.name)}</strong>
          <button type="button" class="close-button" id="closeFeature"
            aria-label="閉じる">×</button>
        </div>
        <div>${escapeHtml(landmark.description)}</div>
        <div class="subtle">
          出典:
          <a href="${escapeAttribute(landmark.source)}"
             target="_blank" rel="noopener noreferrer">資料を開く</a>
        </div>
        <div class="subtle">
          座標: ${landmark.lat}, ${landmark.lon}°
          · カメラ高度設定: ${landmark.height.toLocaleString()} m
        </div>
      `;

      $("closeFeature").addEventListener("click", () => {
        panel.hidden = true;
      });
    }

    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!("indexedDB" in window)) {
          reject(new Error("このブラウザーではIndexedDBを利用できません。"));
          return;
        }

        const request = indexedDB.open("planet-explorer-pins", 1);

        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains("pins")) {
            database.createObjectStore("pins", { keyPath: "id" });
          }
        };

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(
          request.error || new Error("IndexedDBを開けません。")
        );
      });
    }

    function dbOperation(mode, method, value) {
      return new Promise((resolve, reject) => {
        if (!db) {
          reject(new Error("ピン保存用データベースを利用できません。"));
          return;
        }

        const transaction = db.transaction("pins", mode);
        const store = transaction.objectStore("pins");
        let request;

        if (method === "getAll") request = store.getAll();
        if (method === "put") request = store.put(value);
        if (method === "delete") request = store.delete(value);

        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(
          request.error || new Error("ピン保存処理に失敗しました。")
        );
      });
    }

    function createPinId() {
      if (window.crypto && typeof window.crypto.randomUUID === "function") {
        return window.crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    async function handleMapClick(event) {
      // 保存済みピンをクリックしたときは編集画面を開く。
      const picked = viewer.scene.pick(event.position);
      if (Cesium.defined(picked) &&
          picked.id &&
          picked.id.properties &&
          picked.id.properties.pinId) {
        const pinId = picked.id.properties.pinId.getValue();
        const existingPin = pins.find((pin) => pin.id === pinId);

        if (existingPin) {
          showPinEditor(existingPin);
          return;
        }
      }

      let cartesian;

      try {
        cartesian = viewer.scene.pickPosition(event.position);
      } catch (error) {
        console.debug("pickPositionを利用できません:", error);
      }

      if (!Cesium.defined(cartesian)) {
        const ray = viewer.camera.getPickRay(event.position);
        if (ray) cartesian = viewer.scene.globe.pick(ray, viewer.scene);
      }

      if (!Cesium.defined(cartesian)) {
        setStatus("この位置の地表座標を取得できません。");
        return;
      }

      const cartographic =
        ellipsoidFor(activeBody).cartesianToCartographic(cartesian);

      if (!cartographic) {
        setStatus("地表座標を読み取れませんでした。");
        return;
      }

      const pin = {
        id: createPinId(),
        body: activeBody,
        name: "",
        memo: "",
        lon: normalizeLongitude(
          Cesium.Math.toDegrees(cartographic.longitude)
        ),
        lat: Cesium.Math.toDegrees(cartographic.latitude),
        height: cartographic.height,
        createdAt: new Date().toISOString()
      };

      showPinEditor(pin, true);
    }

    function showPinEditor(pin, isNew = false) {
      const panel = $("featurePanel");
      panel.hidden = false;

      panel.innerHTML = `
        <div class="panel-heading">
          <strong>${isNew ? "新しいピン" : "保存ピン"}</strong>
          <button type="button" class="close-button" id="closeFeature"
            aria-label="閉じる">×</button>
        </div>

        <div class="coordinates">
          ${escapeHtml(BODIES[pin.body].label)} ·
          緯度 ${Number(pin.lat).toFixed(6)}° ·
          経度 ${Number(pin.lon).toFixed(6)}° ·
          高さ ${Number(pin.height || 0).toFixed(1)} m
        </div>

        <div class="panel-row">
          <label for="pinName">名前</label>
          <input id="pinName" maxlength="100"
            value="${escapeAttribute(pin.name || "")}"
            placeholder="ピンの名前">
        </div>

        <div class="panel-row">
          <label for="pinMemo">メモ</label>
          <textarea id="pinMemo" maxlength="2000">${escapeHtml(pin.memo || "")}</textarea>
        </div>

        <div class="panel-row">
          <button type="button" id="savePin">保存</button>
          ${isNew ? "" : '<button type="button" id="deletePin">削除</button>'}
        </div>

        <div class="subtle">作成日時: ${escapeHtml(pin.createdAt || "")}</div>
      `;

      $("closeFeature").addEventListener("click", () => {
        panel.hidden = true;
      });

      $("savePin").addEventListener("click", async () => {
        const updatedPin = {
          ...pin,
          name: $("pinName").value.trim() || "名称未設定",
          memo: $("pinMemo").value.trim()
        };

        try {
          await dbOperation("readwrite", "put", updatedPin);
          pins = pins.filter((saved) => saved.id !== updatedPin.id);
          pins.push(updatedPin);
          renderPinEntities();
          renderPins();
          setStatus("ピンをこのブラウザーに保存しました。");
          showPinEditor(updatedPin);
        } catch (error) {
          setStatus(`ピンを保存できません: ${error.message}`);
        }
      });

      if (!isNew) {
        $("deletePin").addEventListener("click", async () => {
          try {
            await dbOperation("readwrite", "delete", pin.id);
            pins = pins.filter((saved) => saved.id !== pin.id);
            renderPinEntities();
            renderPins();
            panel.hidden = true;
            setStatus("ピンを削除しました。");
          } catch (error) {
            setStatus(`ピンを削除できません: ${error.message}`);
          }
        });
      }
    }

    function renderPinEntities() {
      for (const entity of pinEntities.values()) {
        viewer.entities.remove(entity);
      }
      pinEntities.clear();

      for (const pin of pins) {
        const entity = viewer.entities.add({
          id: `saved-pin-${pin.id}`,
          position: Cesium.Cartesian3.fromDegrees(
            normalizeLongitude(Number(pin.lon)),
            Number(pin.lat),
            Number(pin.height || 0),
            ellipsoidFor(pin.body)
          ),
          point: {
            pixelSize: 11,
            color: Cesium.Color.fromCssColorString("#76baff"),
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2,
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          label: {
            text: pin.name || "名称未設定",
            font: "13px sans-serif",
            pixelOffset: new Cesium.Cartesian2(0, -17),
            fillColor: Cesium.Color.WHITE,
            showBackground: true,
            backgroundColor:
              Cesium.Color.fromCssColorString("#101827").withAlpha(.88),
            disableDepthTestDistance: Number.POSITIVE_INFINITY
          },
          properties: {
            pinId: pin.id,
            body: pin.body
          }
        });

        entity.show = pin.body === activeBody;
        pinEntities.set(pin.id, entity);
      }
    }

    function updatePinVisibility() {
      for (const entity of pinEntities.values()) {
        entity.show = entity.properties.body.getValue() === activeBody;
      }
    }

    function renderPins() {
      const content = $("pinsContent");
      content.replaceChildren();

      const visiblePins = pins.filter((pin) => pin.body === activeBody);

      if (!visiblePins.length) {
        content.textContent = "この天体の保存ピンはありません。";
        return;
      }

      for (const pin of visiblePins) {
        const row = document.createElement("div");
        row.className = "pin-item";

        const title = document.createElement("div");
        title.className = "pin-title";
        title.textContent = pin.name || "名称未設定";

        const showButton = document.createElement("button");
        showButton.type = "button";
        showButton.textContent = "表示";
        showButton.addEventListener("click", () => {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(
              normalizeLongitude(Number(pin.lon)),
              Number(pin.lat),
              Math.max(1500, Number(pin.height || 0) + 1500),
              ellipsoidFor(pin.body)
            ),
            duration: 1.5
          });
          showPinEditor(pin);
        });

        const editButton = document.createElement("button");
        editButton.type = "button";
        editButton.textContent = "編集";
        editButton.addEventListener("click", () => showPinEditor(pin));

        row.append(title, showButton, editButton);
        content.appendChild(row);
      }
    }

    function renderLayersPanel() {
      const content = $("layersContent");

      content.innerHTML = `
        <div class="panel-row">
          <strong>${escapeHtml(BODIES[activeBody].label)}アセット</strong>
          <div class="subtle">
            ion Asset ID: ${CONFIG.assets[activeBody]}<br>
            読み込み状態: ${escapeHtml(currentLayerType)}
          </div>
        </div>

        <div class="panel-row subtle">
          アセットの種類、範囲、座標系、経度規約、高さ基準、解像度は
          Cesium ionのアセット詳細で確認してください。
          表示データが画像のみの場合、画像だけでは立体地形になりません。
        </div>

        <hr>

        <div class="panel-row"><strong>追加機能の状態</strong></div>
        <div class="subtle">
          航空写真・衛星写真: 外部提供元と利用権の設定が必要です。<br>
          交通・公共交通・災害・AQI: 外部データ未設定です。
          データ未取得を「異常なし」とは扱っていません。<br>
          360度写真・過去写真: 未接続です。利用可能な写真があるとは仮定していません。<br>
          インドアマップ: 利用権のある施設・フロアデータが未設定です。<br>
          AR: 未実装です。端末権限と位置合わせの検証が必要です。<br>
          地球向け外部情報は月・火星では利用できません。
        </div>
      `;
    }

    function switchBody(body) {
      if (!BODIES[body]) return;

      activeBody = body;
      generation++;
      cameraRequest++;

      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.classList.toggle("selected", button.dataset.body === body);
      });

      renderLandmarks();
      $("featurePanel").hidden = true;

      viewer.scene.globe.ellipsoid = ellipsoidFor(body);
      updatePinVisibility();

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(
          ...BODIES[body].home,
          ellipsoidFor(body)
        ),
        duration: 1.5
      });

      const requestGeneration = generation;
      const promise = loadBodyAsset(body, requestGeneration);
      assetPromises.set(requestGeneration, promise);

      renderPins();
      renderLayersPanel();
    }

    function setupControls() {
      document.querySelectorAll("#bodySwitch button").forEach((button) => {
        button.addEventListener("click", () => {
          switchBody(button.dataset.body);
        });
      });

      $("homeButton").addEventListener("click", () => {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            ...BODIES[activeBody].home,
            ellipsoidFor(activeBody)
          ),
          duration: 1.5
        });
      });

      $("layersButton").addEventListener("click", () => {
        $("layersPanel").hidden = !$("layersPanel").hidden;
        renderLayersPanel();
      });

      $("pinsButton").addEventListener("click", () => {
        $("pinsPanel").hidden = !$("pinsPanel").hidden;
        renderPins();
      });

      document.querySelectorAll("[data-close]").forEach((button) => {
        button.addEventListener("click", () => {
          $(button.dataset.close).hidden = true;
        });
      });
    }

    async function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。通信状態を確認してください。");
        return;
      }

      createViewer();
      setupControls();
      renderLandmarks();
      renderLayersPanel();

      try {
        db = await openDatabase();
        pins = await dbOperation("readonly", "getAll") || [];
        renderPinEntities();
        renderPins();
      } catch (error) {
        console.error(error);
        setStatus(`ピン保存を利用できません: ${error.message}`);
      }

      const requestGeneration = generation;
      const promise = loadBodyAsset("earth", requestGeneration);
      assetPromises.set(requestGeneration, promise);
    }

    start();
  </script>
</body>
</html>
