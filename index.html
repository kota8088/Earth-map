<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planet Explorer</title>

  <link
    rel="stylesheet"
    href="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Widgets/widgets.css">

  <script>
    window.CESIUM_BASE_URL =
      "https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/";
  </script>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.132/Build/Cesium/Cesium.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(11, 18, 31, .96);
      --line: rgba(174, 198, 231, .2);
      --text: #e8eef9;
      --muted: #a6b3c7;
      --accent: #76baff;
    }

    * { box-sizing: border-box; }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--text);
      background: #080d17;
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #cesiumContainer {
      position: absolute;
      inset: 0;
    }

    .topbar {
      position: absolute;
      z-index: 10;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      min-height: 56px;
      padding: 8px 14px;
      background: rgba(5, 9, 16, .96);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-weight: 800;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .brand span { color: var(--accent); }

    .button-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
    }

    .top-actions { margin-left: auto; }

    button, input, select {
      color: var(--text);
      background: rgba(27, 39, 58, .96);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 10px;
      font: inherit;
    }

    button {
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover, input:focus, select:focus {
      border-color: rgba(118, 186, 255, .8);
      outline: none;
    }

    button:disabled { cursor: wait; opacity: .6; }

    button.selected {
      color: #07111e;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .search-form {
      display: flex;
      gap: 6px;
      min-width: 230px;
    }

    .search-form input {
      min-width: 0;
      width: 190px;
    }

    .search-form button { background: #17314c; }

    .map-picker {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .map-picker label {
      color: var(--muted);
      white-space: nowrap;
    }

    .map-picker select {
      max-width: 280px;
      cursor: pointer;
    }

    .map-description {
      position: absolute;
      z-index: 7;
      top: 68px;
      left: 12px;
      max-width: min(440px, calc(100vw - 24px));
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
      font-size: 12px;
    }

    .status {
      position: absolute;
      z-index: 6;
      left: 12px;
      bottom: 18px;
      max-width: min(760px, calc(100vw - 24px));
      max-height: 30vh;
      overflow: auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--muted);
      background: var(--panel);
      pointer-events: none;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .panel {
      position: absolute;
      z-index: 8;
      top: 125px;
      right: 12px;
      width: min(380px, calc(100vw - 24px));
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--panel);
      box-shadow: 0 14px 45px rgba(0, 0, 0, .35);
    }

    .panel[hidden] { display: none; }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .topbar { gap: 7px; padding: 7px 9px; }
      .top-actions { margin-left: 0; }
      .search-form { min-width: 0; }
      .search-form input { width: min(190px, 38vw); }
    }

    @media (max-width: 600px) {
      .brand { font-size: 12px; }

      .topbar button, .topbar input, .topbar select {
        padding: 6px 8px;
        font-size: 12px;
      }

      .search-form input { width: min(170px, 42vw); }
      .map-picker { flex-wrap: wrap; }
      .map-picker select { max-width: calc(100vw - 24px); }
      .map-description { top: 125px; }
      .panel { top: 175px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">PLANET <span>EXPLORER</span></div>

    <nav class="button-row" aria-label="天体の切り替え">
      <button type="button" data-body="earth" class="selected">地球</button>
      <button type="button" data-body="moon">月</button>
      <button type="button" data-body="mars">火星</button>
    </nav>

    <form id="searchForm" class="search-form" role="search">
      <input
        id="searchInput"
        type="search"
        placeholder="場所を検索（例：東京駅）"
        aria-label="検索する場所">
      <button id="searchButton" type="submit">検索</button>
    </form>

    <div class="map-picker">
      <label for="imagerySelect">地図の見た目</label>
      <select id="imagerySelect">
        <option value="satelliteLabels">航空写真（地名・道路あり）</option>
        <option value="satellite">航空写真（文字なし）</option>
        <option value="roadmap">道路マップ</option>
        <option value="labelsOnly">ラベルのみ</option>
        <option value="contour">等高線</option>
      </select>
    </div>

    <div class="button-row top-actions">
      <button type="button" id="homeButton">全体表示</button>
      <button type="button" id="infoButton">データ情報</button>
    </div>
  </header>

  <div id="mapDescription" class="map-description"></div>
  <div id="cesiumContainer" aria-label="天体の3D表示"></div>
  <div id="status" class="status" role="status">初期化中…</div>

  <aside id="infoPanel" class="panel" hidden>
    <div class="panel-heading">
      <strong>データ情報</strong>
      <button type="button" id="closeInfo" aria-label="閉じる">×</button>
    </div>
    <div id="infoContent" class="subtle"></div>
  </aside>

  <script>
    "use strict";

    const BODIES = {
      earth: {
        name: "地球",
        assetId: 2275207,
        dataName: "Google Photorealistic 3D Tiles"
      },
      moon: {
        name: "月",
        assetId: 2684829,
        dataName: "Cesium Moon 3D Tiles"
      },
      mars: {
        name: "火星",
        assetId: 3644333,
        dataName: "Cesium Mars 3D Tiles"
      }
    };

    // 提示されたCesium ionのImagery Asset ID
    const IMAGERY = {
      satelliteLabels: {
        name: "航空写真（地名・道路あり）",
        description: "Google Mapsの航空写真に地名・道路ラベルを表示します。",
        assetId: 3830183
      },
      satellite: {
        name: "航空写真（文字なし）",
        description: "Google Mapsのラベルなし航空写真を表示します。",
        assetId: 3830182
      },
      roadmap: {
        name: "道路マップ",
        description: "Google Mapsの道路マップを表示します。",
        assetId: 3830184
      },
      labelsOnly: {
        name: "ラベルのみ",
        description: "Google Mapsの地名・道路ラベルを表示します。",
        assetId: 3830185
      },
      contour: {
        name: "等高線",
        description: "Google Mapsの等高線オルソ画像を表示します。",
        assetId: 3830186
      }
    };

    const $ = (id) => document.getElementById(id);

    let viewer = null;
    let ionGeocoder = null;
    let activeBody = "earth";
    let currentTileset = null;
    let imageryLayer = null;
    let tilesetGeneration = 0;
    let imageryGeneration = 0;

    function setStatus(message) {
      $("status").textContent = message;
    }

    function getErrorDetails(error) {
      if (!error) return "詳細不明";

      const details = [];
      if (error.name) details.push(`名前: ${error.name}`);
      if (error.message) details.push(`内容: ${error.message}`);
      if (error.statusCode) details.push(`HTTP: ${error.statusCode}`);
      if (error.response?.status) {
        details.push(`HTTP: ${error.response.status}`);
      }
      if (error.response?.statusText) {
        details.push(`応答: ${error.response.statusText}`);
      }
      if (error.cause?.message) {
        details.push(`原因: ${error.cause.message}`);
      }

      return details.length ? details.join(" / ") : String(error);
    }

    async function fetchIonToken() {
      const response = await fetch("/api/cesium-token", {
        method: "GET",
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error(`トークンAPIの応答: HTTP ${response.status}`);
      }

      const data = await response.json();

      if (typeof data.token !== "string" || !data.token.trim()) {
        throw new Error("トークンが空です");
      }

      return data.token.trim();
    }

    function updateControls() {
      document.querySelectorAll("[data-body]").forEach((button) => {
        button.classList.toggle(
          "selected",
          button.dataset.body === activeBody
        );
      });

      $("imagerySelect").disabled = activeBody !== "earth";
      $("mapDescription").hidden = activeBody !== "earth";
      updateMapDescription();
    }

    function updateMapDescription() {
      const map = IMAGERY[$("imagerySelect").value];
      $("mapDescription").textContent = map ? map.description : "";
    }

    function removeCurrentTileset() {
      if (!viewer || !currentTileset) return;

      try {
        if (!currentTileset.isDestroyed()) {
          viewer.scene.primitives.remove(currentTileset);
        }
      } catch (error) {
        console.warn("前の3D Tilesを削除できませんでした:", error);
      }

      currentTileset = null;
    }

    function removeImageryLayer() {
      if (!viewer || !imageryLayer) {
        imageryLayer = null;
        return;
      }

      try {
        viewer.imageryLayers.remove(imageryLayer, true);
      } catch (error) {
        console.warn("画像レイヤーを削除できませんでした:", error);
      }

      imageryLayer = null;
    }

    function showEarthView() {
      if (!viewer) return;

      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(0, 0, 18000000),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0
        },
        duration: 1.2
      });
    }

    function focusTileset(tileset) {
      if (!viewer || !tileset) return false;

      const sphere = tileset.boundingSphere;

      if (
        !sphere ||
        !sphere.center ||
        !Number.isFinite(sphere.radius) ||
        sphere.radius <= 0
      ) {
        console.error("3D TilesのboundingSphereが不正です:", sphere);
        return false;
      }

      viewer.camera.flyToBoundingSphere(sphere, {
        duration: 1.5,
        offset: new Cesium.HeadingPitchRange(
          0,
          Cesium.Math.toRadians(-25),
          Math.max(sphere.radius * 2.8, 1000)
        )
      });

      return true;
    }

    function goHome() {
      if (!viewer) return;

      if (activeBody === "earth") {
        showEarthView();
      } else if (currentTileset) {
        focusTileset(currentTileset);
      } else {
        setStatus("表示できる3D Tilesがありません。読み込み状態を確認してください。");
      }
    }

    function renderInfo(state = "読み込み中") {
      const body = BODIES[activeBody];
      let dataName = body.dataName;

      if (activeBody === "earth") {
        const imagery = IMAGERY[$("imagerySelect").value];
        if (imagery) {
          dataName += ` / ${imagery.name} (Asset ID: ${imagery.assetId})`;
        }
      }

      $("infoContent").textContent =
        `天体: ${body.name}\n` +
        `3D Tiles Asset ID: ${body.assetId}\n` +
        `データ: ${dataName}\n` +
        `状態: ${state}`;
    }

    async function loadImagery() {
      if (!viewer || activeBody !== "earth") return;

      const requestId = ++imageryGeneration;
      const selected = IMAGERY[$("imagerySelect").value];
      if (!selected) return;

      updateMapDescription();
      setStatus(`${selected.name}を読み込み中…`);
      renderInfo("地図を読み込み中");

      try {
        const provider =
          await Cesium.IonImageryProvider.fromAssetId(selected.assetId);

        if (requestId !== imageryGeneration || activeBody !== "earth") {
          return;
        }

        removeImageryLayer();
        imageryLayer = viewer.imageryLayers.addImageryProvider(provider);

        setStatus(`${selected.name}を表示しています。`);
        renderInfo("地図の読み込み完了");
      } catch (error) {
        if (requestId !== imageryGeneration) return;

        console.error(
          `画像レイヤーの読み込みエラー。Asset ID: ${selected.assetId}`,
          error
        );

        const details = getErrorDetails(error);
        setStatus(
          `${selected.name}を読み込めません。\n` +
          `Asset ID: ${selected.assetId}\n${details}\n` +
          "Assetの有効性とトークンの利用権限を確認してください。"
        );

        renderInfo(`地図の読み込み失敗: ${details}`);
      }
    }

    async function loadActiveTileset() {
      if (!viewer) return;

      const requestId = ++tilesetGeneration;
      const bodyKey = activeBody;
      const body = BODIES[bodyKey];
      const isEarth = bodyKey === "earth";

      removeCurrentTileset();
      viewer.scene.globe.show = isEarth;
      viewer.scene.skyAtmosphere.show = isEarth;

      if (!isEarth) {
        imageryGeneration++;
        removeImageryLayer();
      }

      updateControls();
      setStatus(`${body.dataName}を読み込み中…`);
      renderInfo("3Dデータ読み込み中");

      try {
        const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(
          body.assetId
        );

        if (requestId !== tilesetGeneration) {
          if (!tileset.isDestroyed()) tileset.destroy();
          return;
        }

        tileset.show = true;
        tileset.maximumScreenSpaceError = 8;

        if (tileset.tileFailed) {
          tileset.tileFailed.addEventListener((event) => {
            console.error(`${body.dataName}のタイル読み込み失敗:`, event);
          });
        }

        viewer.scene.primitives.add(tileset);
        currentTileset = tileset;

        if (isEarth) {
          viewer.scene.globe.show = true;
          viewer.scene.skyAtmosphere.show = true;
          setStatus(`${body.dataName}を読み込みました。`);
        } else {
          viewer.scene.globe.show = false;
          viewer.scene.skyAtmosphere.show = false;

          const cameraMoved = focusTileset(tileset);
          setStatus(
            cameraMoved
              ? `${body.name}の3D Tilesを読み込みました。\n全体表示へカメラを移動しました。`
              : `${body.name}の3D Tilesは読み込みましたが、表示範囲を取得できませんでした。`
          );
        }

        renderInfo("3Dデータの読み込み完了");
      } catch (error) {
        if (requestId !== tilesetGeneration) return;

        console.error(
          `${body.dataName}の読み込みエラー。Asset ID: ${body.assetId}`,
          error
        );

        const details = getErrorDetails(error);
        viewer.scene.globe.show = isEarth;
        viewer.scene.skyAtmosphere.show = isEarth;

        setStatus(
          `${body.dataName}を読み込めません。\n` +
          `Asset ID: ${body.assetId}\n${details}\n` +
          "Assetの有効性とトークンの利用権限を確認してください。"
        );

        renderInfo(`3Dデータ読み込み失敗: ${details}`);
      }
    }

    async function switchBody(bodyKey) {
      if (!Object.prototype.hasOwnProperty.call(BODIES, bodyKey) || !viewer) {
        return;
      }

      activeBody = bodyKey;
      updateControls();

      if (bodyKey === "earth") {
        viewer.scene.globe.show = true;
        viewer.scene.skyAtmosphere.show = true;
        showEarthView();

        await Promise.all([
          loadActiveTileset(),
          loadImagery()
        ]);
      } else {
        viewer.scene.globe.show = false;
        viewer.scene.skyAtmosphere.show = false;
        imageryGeneration++;
        removeImageryLayer();
        await loadActiveTileset();
      }
    }

    async function searchLocation(event) {
      event.preventDefault();

      const query = $("searchInput").value.trim();
      if (!query) {
        setStatus("検索する場所を入力してください。");
        return;
      }

      if (!ionGeocoder) {
        setStatus("場所検索を初期化できていません。");
        return;
      }

      $("searchButton").disabled = true;
      setStatus(`「${query}」を検索中…`);

      try {
        const results = await ionGeocoder.geocode(query);

        if (!results || results.length === 0) {
          setStatus(`「${query}」の場所が見つかりませんでした。`);
          return;
        }

        if (activeBody !== "earth") {
          await switchBody("earth");
        }

        const result = results[0];
        if (result.destination) {
          viewer.camera.flyTo({
            destination: result.destination,
            duration: 1.5
          });
        }

        setStatus(`「${result.displayName || query}」を表示しています。`);
      } catch (error) {
        console.error("場所検索エラー:", error);
        setStatus(`場所を検索できません。\n${getErrorDetails(error)}`);
      } finally {
        $("searchButton").disabled = false;
      }
    }

    function setupControls() {
      document.querySelectorAll("[data-body]").forEach((button) => {
        button.addEventListener("click", () => {
          switchBody(button.dataset.body);
        });
      });

      $("imagerySelect").addEventListener("change", () => {
        updateMapDescription();
        if (activeBody === "earth") loadImagery();
      });

      $("searchForm").addEventListener("submit", searchLocation);
      $("homeButton").addEventListener("click", goHome);

      $("infoButton").addEventListener("click", () => {
        $("infoPanel").hidden = !$("infoPanel").hidden;
        renderInfo();
      });

      $("closeInfo").addEventListener("click", () => {
        $("infoPanel").hidden = true;
      });
    }

    async function start() {
      if (!window.Cesium) {
        setStatus("CesiumJSを読み込めません。ネット接続と配信URLを確認してください。");
        return;
      }

      setStatus("Cesium ionトークンを取得中…");

      try {
        Cesium.Ion.defaultAccessToken = await fetchIonToken();
      } catch (error) {
        console.error("Cesium ionトークン取得エラー:", error);
        setStatus(
          `トークンを取得できません。\n${getErrorDetails(error)}\n` +
          "/api/cesium-token とサーバー側の環境変数を確認してください。"
        );
        return;
      }

      try {
        viewer = new Cesium.Viewer("cesiumContainer", {
          baseLayer: false,
          terrainProvider: new Cesium.EllipsoidTerrainProvider(),
          animation: false,
          timeline: false,
          geocoder: false,
          homeButton: false,
          sceneModePicker: false,
          baseLayerPicker: false,
          navigationHelpButton: false,
          fullscreenButton: false,
          infoBox: false,
          selectionIndicator: false,
          useBrowserRecommendedResolution: true
        });

        ionGeocoder = new Cesium.IonGeocoderService({
          scene: viewer.scene
        });
      } catch (error) {
        console.error("Cesium初期化エラー:", error);
        setStatus(`Cesiumを初期化できませんでした。\n${getErrorDetails(error)}`);
        return;
      }

      viewer.resolutionScale = Math.min(window.devicePixelRatio || 1, 1);
      viewer.scene.globe.show = true;
      viewer.scene.globe.baseColor =
        Cesium.Color.fromCssColorString("#101722");
      viewer.scene.backgroundColor = Cesium.Color.BLACK;

      const controller = viewer.scene.screenSpaceCameraController;
      controller.enableCollisionDetection = false;
      controller.maximumMovementRatio = 0.2;
      controller.inertiaSpin = 0.25;
      controller.inertiaTranslate = 0.75;
      controller.inertiaZoom = 0.7;

      setupControls();
      updateControls();
      showEarthView();

      await Promise.all([
        loadActiveTileset(),
        loadImagery()
      ]);
    }

    start();
  </script>
</body>
</html>
